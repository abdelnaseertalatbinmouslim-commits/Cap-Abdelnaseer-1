<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#0b0d12"
    >

    <meta
        name="description"
        content="تسجيل الدخول إلى منصة الكوتش"
    >

    <title>تسجيل الدخول | منصة الكوتش</title>

    <link

        type="image/jpeg"
        href="1783950091830.jpg"
    >

    <link

        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Tajawal:wght@400;500;700;800&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="index.css"
    >
</head>

<body>

    <!-- =========================
         BACKGROUND
    ========================== -->
    <div
        class="background-decoration"
        aria-hidden="true"
    >
        <span class="background-orb background-orb-one"></span>
        <span class="background-orb background-orb-two"></span>
        <span class="background-grid"></span>
        <span class="background-noise"></span>
    </div>


    <!-- =========================
         HEADER
    ========================== -->
    <header class="site-header">

        <div class="container header-container">

            <a
                href="index.html"
                class="brand"
                aria-label="العودة إلى منصة الكوتش"
            >
                <span class="brand-mark">
                    <span></span>
                    <span></span>
                    <span></span>
                </span>

                <span class="brand-text">
                    <strong>منصة الكوتش</strong>
                    <small>تعلم • تطور • انجح</small>
                </span>
            </a>

            <div class="header-actions">

                <button
                    type="button"
                    class="theme-toggle"
                    id="themeToggle"
                    data-theme-toggle
                    aria-label="تغيير الوضع"
                    aria-pressed="false"
                >
                    <span
                        class="theme-icon theme-icon-sun"
                        aria-hidden="true"
                    >
                        ☀
                    </span>

                    <span
                        class="theme-icon theme-icon-moon"
                        aria-hidden="true"
                    >
                        ☾
                    </span>
                </button>

                <a
                    href="index.html"
                    class="header-login-button"
                >
                    الرئيسية
                </a>

                <a
                    href="register.html"
                    class="header-register-button"
                >
                    إنشاء حساب
                </a>

            </div>

        </div>

    </header>


    <!-- =========================
         LOGIN
    ========================== -->
    <main>

        <section class="auth-section">

            <div class="container">

                <div class="auth-layout">

                    <!-- Visual Side -->
                    <div class="auth-visual reveal">

                        <div
                            class="visual-glow"
                            aria-hidden="true"
                        ></div>

                        <div class="profile-orbit orbit-one"></div>
                        <div class="profile-orbit orbit-two"></div>

                        <div class="profile-badge profile-badge-top">
                            <span>COACH</span>
                        </div>

                        <div class="profile-image-wrap">

                            <div class="profile-image-ring ring-one"></div>
                            <div class="profile-image-ring ring-two"></div>

                            <div class="profile-image">

                                <img
                                    src="1783950091830.jpg"
                                    alt="صورة الكوتش"
                                    class="hero-image"
                                    loading="eager"
                                    decoding="async"
                                >

                            </div>

                            <span class="profile-status"></span>

                        </div>

                        <div class="profile-floating-card card-one">

                            <span class="floating-icon">
                                ✦
                            </span>

                            <div>
                                <strong>تعلم</strong>
                                <small>بشكل أذكى</small>
                            </div>

                        </div>

                        <div class="profile-floating-card card-two">

                            <span class="floating-icon">
                                ◈
                            </span>

                            <div>
                                <strong>محتوى</strong>
                                <small>منظم ومميز</small>
                            </div>

                        </div>

                    </div>


                    <!-- Login Card -->
                    <div class="auth-card-wrap reveal">

                        <div class="auth-card">

                            <div class="auth-card-header">

                                <span class="section-kicker">
                                    WELCOME BACK
                                </span>

                                <h1>
                                    تسجيل الدخول
                                </h1>

                                <p>
                                    ادخل إلى حسابك وكمل رحلتك
                                    داخل منصة الكوتش.
                                </p>

                            </div>


                            <!-- Login Form -->
                            <form
                                id="loginForm"
                                class="auth-form"
                                novalidate
                            >

                                <div class="form-group">

                                    <label for="loginEmail">
                                        البريد الإلكتروني
                                    </label>

                                    <div class="input-wrap">

                                        <span
                                            class="input-icon"
                                            aria-hidden="true"
                                        >
                                            @
                                        </span>

                                        <input
                                            type="email"
                                            id="loginEmail"
                                            name="email"
                                            autocomplete="email"
                                            inputmode="email"
                                            placeholder="اكتب البريد الإلكتروني"
                                            required
                                        >

                                    </div>

                                    <small
                                        class="field-error"
                                        id="loginEmailError"
                                        aria-live="polite"
                                    ></small>

                                </div>


                                <div class="form-group">

                                    <label for="loginPassword">
                                        كلمة المرور
                                    </label>

                                    <div class="input-wrap">

                                        <span
                                            class="input-icon"
                                            aria-hidden="true"
                                        >
                                            •
                                        </span>

                                        <input
                                            type="password"
                                            id="loginPassword"
                                            name="password"
                                            autocomplete="current-password"
                                            placeholder="اكتب كلمة المرور"
                                            required
                                        >

                                        <button
                                            type="button"
                                            class="password-toggle"
                                            id="passwordToggle"
                                            aria-label="إظهار كلمة المرور"
                                            aria-pressed="false"
                                        >
                                            ◉
                                        </button>

                                    </div>

                                    <small
                                        class="field-error"
                                        id="loginPasswordError"
                                        aria-live="polite"
                                    ></small>

                                </div>


                                <div class="auth-form-options">

                                    <label class="remember-option">

                                        <input
                                            type="checkbox"
                                            id="rememberLogin"
                                            name="remember"
                                        >

                                        <span>
                                            تذكرني
                                        </span>

                                    </label>

                                    <a
                                        href="forgot-password.html"
                                        class="forgot-password-link"
                                    >
                                        نسيت كلمة المرور؟
                                    </a>

                                </div>


                                <div
                                    id="loginMessage"
                                    class="form-message"
                                    aria-live="polite"
                                    role="status"
                                ></div>


                                <button
                                    type="submit"
                                    id="loginSubmit"
                                    class="modal-submit-button"
                                >
                                    تسجيل الدخول
                                </button>

                            </form>


                            <div class="auth-divider">
                                <span>أو</span>
                            </div>


                            <div class="auth-switch">

                                <span>
                                    مش عندك حساب؟
                                </span>

                                <a href="register.html">
                                    إنشاء حساب جديد
                                </a>

                            </div>


                            <div class="auth-back-link">

                                <a href="index.html">
                                    <span>→</span>
                                    العودة إلى الرئيسية
                                </a>

                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </section>

    </main>


    <!-- =========================
         TOAST
    ========================== -->
    <div
        id="toastContainer"
        class="toast-container"
        aria-live="polite"
        aria-atomic="true"
    ></div>


    <!-- ==================================================
         FIREBASE SDK
    =================================================== -->

    <script
        src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"
    ></script>

    <script
        src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"
    ></script>

    <script
        src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"
    ></script>


    <!-- ==================================================
         FIREBASE PROJECT LAYERS
    =================================================== -->

    <script src="firebase-config.js"></script>

    <script src="firebase-auth.js"></script>

    <script src="firebase-database.js"></script>

    <script src="firebase-content.js"></script>

    <script src="firebase-features.js"></script>


    <!-- ==================================================
         LOGIN PAGE LOGIC
    =================================================== -->

    <script>
        "use strict";

        let loginSubmitting = false;

        const $ = (selector, parent = document) =>
            parent.querySelector(selector);

        function storageGet(key) {
            try {
                return localStorage.getItem(key);
            } catch (error) {
                return null;
            }
        }

        function storageSet(key, value) {
            try {
                localStorage.setItem(key, value);
            } catch (error) {}
        }

        function initializeTheme() {
            const toggle =
                $("#themeToggle");

            const savedTheme =
                storageGet("coach_platform_theme");

            const theme =
                savedTheme === "light" ||
                savedTheme === "dark"
                    ? savedTheme
                    : "dark";

            applyTheme(theme, false);

            if (toggle) {
                toggle.addEventListener(
                    "click",
                    () => {
                        const current =
                            document.documentElement
                                .getAttribute("data-theme") ||
                            "dark";

                        applyTheme(
                            current === "dark"
                                ? "light"
                                : "dark",
                            true
                        );
                    }
                );
            }
        }

        function applyTheme(theme, save = true) {
            const normalized =
                theme === "light"
                    ? "light"
                    : "dark";

            document.documentElement
                .setAttribute(
                    "data-theme",
                    normalized
                );

            document.body.classList.toggle(
                "light-theme",
                normalized === "light"
            );

            document.body.classList.toggle(
                "dark-theme",
                normalized === "dark"
            );

            const toggle =
                $("#themeToggle");

            if (toggle) {
                toggle.setAttribute(
                    "aria-pressed",
                    String(normalized === "light")
                );

                toggle.setAttribute(
                    "aria-label",
                    normalized === "light"
                        ? "تفعيل الوضع الداكن"
                        : "تفعيل الوضع الفاتح"
                );
            }

            if (save) {
                storageSet(
                    "coach_platform_theme",
                    normalized
                );
            }
        }


        function showToast(
            message,
            type = "info"
        ) {
            const container =
                $("#toastContainer");

            if (!container) {
                return;
            }

            const toast =
                document.createElement("div");

            toast.className =
                `toast toast-${type}`;

            const text =
                document.createElement("span");

            text.className =
                "toast-message";

            text.textContent =
                message;

            toast.appendChild(text);

            container.appendChild(toast);

            requestAnimationFrame(() => {
                toast.classList.add("show");
            });

            setTimeout(() => {
                toast.classList.remove("show");

                setTimeout(() => {
                    toast.remove();
                }, 300);
            }, 3500);
        }


        function setMessage(
            message,
            type = ""
        ) {
            const element =
                $("#loginMessage");

            if (!element) {
                return;
            }

            element.textContent =
                message || "";

            element.className =
                `form-message ${type}`;
        }


        function setFieldError(
            id,
            message
        ) {
            const element =
                $("#" + id);

            if (!element) {
                return;
            }

            element.textContent =
                message || "";
        }


        function validateLogin(
            email,
            password
        ) {
            setFieldError(
                "loginEmailError",
                ""
            );

            setFieldError(
                "loginPasswordError",
                ""
            );

            if (!email) {
                setFieldError(
                    "loginEmailError",
                    "من فضلك اكتب البريد الإلكتروني."
                );

                return false;
            }

            if (!email.includes("@")) {
                setFieldError(
                    "loginEmailError",
                    "اكتب بريدًا إلكترونيًا صحيحًا."
                );

                return false;
            }

            if (!password) {
                setFieldError(
                    "loginPasswordError",
                    "من فضلك اكتب كلمة المرور."
                );

                return false;
            }

            return true;
        }


        function setSubmitting(
            state
        ) {
            const button =
                $("#loginSubmit");

            if (!button) {
                return;
            }

            loginSubmitting =
                state;

            button.disabled =
                state;

            if (state) {
                button.dataset.originalText =
                    button.textContent;

                button.textContent =
                    "جاري تسجيل الدخول...";
            } else {
                button.textContent =
                    button.dataset.originalText ||
                    "تسجيل الدخول";
            }
        }


        function getFirebaseErrorMessage(
            error
        ) {
            if (
                window.FirebaseAuth &&
                typeof window.FirebaseAuth
                    .getErrorMessage ===
                    "function"
            ) {
                return window.FirebaseAuth
                    .getErrorMessage(error);
            }

            if (
                window.FirebaseCore &&
                typeof window.FirebaseCore
                    .getErrorMessage ===
                    "function"
            ) {
                return window.FirebaseCore
                    .getErrorMessage(error);
            }

            return "تعذر تسجيل الدخول. حاول مرة أخرى.";
        }


        async function loginUser(
            email,
            password,
            remember
        ) {
            if (
                !window.FirebaseAuth ||
                typeof window.FirebaseAuth
                    .loginWithEmail !==
                    "function"
            ) {
                throw new Error(
                    "Firebase Authentication is not available."
                );
            }

            return window.FirebaseAuth
                .loginWithEmail(
                    email,
                    password,
                    {
                        remember
                    }
                );
        }


        async function handleLogin(
            event
        ) {
            event.preventDefault();

            if (loginSubmitting) {
                return;
            }

            const email =
                $("#loginEmail")
                    ?.value
                    .trim() || "";

            const password =
                $("#loginPassword")
                    ?.value || "";

            const remember =
                Boolean(
                    $("#rememberLogin")
                        ?.checked
                );

            if (
                !validateLogin(
                    email,
                    password
                )
            ) {
                return;
            }

            setMessage("", "");

            setSubmitting(true);

            try {
                const result =
                    await loginUser(
                        email,
                        password,
                        remember
                    );

                const user =
                    result?.user ||
                    window.FirebaseAuth
                        ?.getCurrentUser?.();

                if (!user) {
                    throw new Error(
                        "تم تسجيل الدخول ولكن لم يتم العثور على جلسة المستخدم."
                    );
                }

                storageSet(
                    "coach_platform_remembered_login",
                    remember
                        ? "true"
                        : "false"
                );

                setMessage(
                    "تم تسجيل الدخول بنجاح. جاري فتح حسابك...",
                    "success"
                );

                showToast(
                    "تم تسجيل الدخول بنجاح",
                    "success"
                );

                setTimeout(() => {
                    window.location.href =
                        "dashboard.html";
                }, 700);

            } catch (error) {
                console.error(
                    "Login error:",
                    error
                );

                const message =
                    getFirebaseErrorMessage(
                        error
                    );

                setMessage(
                    message,
                    "error"
                );

                showToast(
                    message,
                    "error"
                );

            } finally {
                setSubmitting(false);
            }
        }


        function initializePasswordToggle() {
            const button =
                $("#passwordToggle");

            const input =
                $("#loginPassword");

            if (!button || !input) {
                return;
            }

            button.addEventListener(
                "click",
                () => {
                    const showing =
                        input.type ===
                        "text";

                    input.type =
                        showing
                            ? "password"
                            : "text";

                    button.setAttribute(
                        "aria-pressed",
                        String(!showing)
                    );

                    button.setAttribute(
                        "aria-label",
                        showing
                            ? "إظهار كلمة المرور"
                            : "إخفاء كلمة المرور"
                    );
                }
            );
        }


        function initializeReveal() {
            const elements =
                document.querySelectorAll(
                    ".reveal"
                );

            if (!elements.length) {
                return;
            }

            if (
                !("IntersectionObserver" in window)
            ) {
                elements.forEach(
                    (element) => {
                        element.classList.add(
                            "visible"
                        );

                        element.classList.add(
                            "revealed"
                        );
                    }
                );

                return;
            }

            const observer =
                new IntersectionObserver(
                    (entries) => {
                        entries.forEach(
                            (entry) => {
                                if (
                                    !entry.isIntersecting
                                ) {
                                    return;
                                }

                                entry.target.classList.add(
                                    "visible"
                                );

                                entry.target.classList.add(
                                    "revealed"
                                );

                                observer.unobserve(
                                    entry.target
                                );
                            }
                        );
                    },
                    {
                        threshold: 0.08
                    }
                );

            elements.forEach(
                (element) => {
                    observer.observe(
                        element
                    );
                }
            );
        }


        async function handleExistingSession() {
            try {
                if (
                    !window.FirebaseAuth ||
                    typeof window.FirebaseAuth
                        .getCurrentUser !==
                        "function"
                ) {
                    return;
                }

                const user =
                    window.FirebaseAuth
                        .getCurrentUser();

                if (!user) {
                    return;
                }

                /*
                   المستخدم لديه جلسة Firebase
                   بالفعل. لا ننقله تلقائيًا أثناء
                   تحميل الصفحة حتى لا نقطع عليه
                   عملية الدخول أو تغيير الحساب.
                */

            } catch (error) {
                console.error(
                    "Existing session check error:",
                    error
                );
            }
        }


        function initializeLoginPage() {
            initializeTheme();
            initializePasswordToggle();
            initializeReveal();

            const form =
                $("#loginForm");

            if (form) {
                form.addEventListener(
                    "submit",
                    handleLogin
                );
            }

            handleExistingSession();
        }


        if (
            document.readyState ===
            "loading"
        ) {
            document.addEventListener(
                "DOMContentLoaded",
                initializeLoginPage,
                { once: true }
            );
        } else {
            initializeLoginPage();
        }
    </script>

</body>
</html>
