here<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول - منصة الكابتن</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="login-page-body">

  <div class="cyber-bg-glow"></div>

  <div class="login-container">
    <div class="glass-panel login-card">
      <a href="index.html" class="back-home">⬅ العودة للمنصة</a>
      
      <div class="modal-tabs" style="margin-top: 25px;">
        <button class="modal-tab-btn active" id="tabJoinBtn" onclick="switchAuthTab('user')">طلب انضمام جديد</button>
        <button class="modal-tab-btn" id="tabAdminBtn" onclick="switchAuthTab('admin')">تسجيل الأدمن</button>
      </div>

      <!-- نموذج طلب الانضمام -->
      <form id="userJoinForm" onsubmit="handleJoinSubmit(event)">
        <div class="form-group">
          <label>الاسم بالكامل:</label>
          <input type="text" class="form-control" id="studentName" required placeholder="أدخل اسمك ثلاثي">
        </div>
        <div class="form-group">
          <label>رقم الواتساب:</label>
          <input type="tel" class="form-control" id="studentPhone" required placeholder="01xxxxxxxxx">
        </div>
        <div class="form-group">
          <label>الفرقة الدراسية:</label>
          <select class="form-control" id="studentLevel">
            <option value="الفرقة الأولى">الفرقة الأولى</option>
            <option value="الفرقة الثانية">الفرقة الثانية</option>
            <option value="الفرقة الثالثة">الفرقة الثالثة</option>
            <option value="الفرقة الرابعة">الفرقة الرابعة</option>
          </select>
        </div>
        <button type="submit" class="btn-primary">إرسال طلب الانضمام للتليجرام</button>
      </form>

      <!-- نموذج الأدمن -->
      <form id="adminLoginForm" style="display: none;" onsubmit="handleAdminLogin(event)">
        <div class="form-group">
          <label>اسم المستخدم:</label>
          <input type="text" class="form-control" id="adminUser" required placeholder="أدخل اسم المستخدم">
        </div>
        <div class="form-group">
          <label>كلمة المرور:</label>
          <input type="password" class="form-control" id="adminPass" required placeholder="******">
        </div>
        <button type="submit" class="btn-primary">دخول لوحة التحكم</button>
      </form>

      <!-- نبذة عن منشئ المنصة والدعم الفني -->
      <div class="creator-bio-section">
        <h3>👨‍💻 عن منشئ المنصة</h3>
        <p><strong>كابتن عبدالناصر</strong> - مطور ومصمم المنصة، طالب بكلية علوم الرياضة جامعة أسيوط.</p>
        <div class="support-links">
          <a href="https://wa.me/201098227150" target="_blank" class="btn-support whatsapp">💬 واتساب الدعم</a>
          <a href="https://t.me/CapAbdo1" target="_blank" class="btn-support telegram">✈️ تليجرام الدعم</a>
          <a href="https://www.facebook.com/cap.abdelnaseer.talat" target="_blank" class="btn-support facebook">📘 فيسبوك الكابتن</a>
        </div>
      </div>

    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
