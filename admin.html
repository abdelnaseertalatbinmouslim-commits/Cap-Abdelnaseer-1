<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم الأدمن | منصة الكابتن</title>
    <style>
        :root {
            --bg-color: #f0f4f8;
            --card-bg: rgba(255, 255, 255, 0.95);
            --text-color: #0f172a;
            --text-muted: #475569;
            --primary: #2563eb;
            --primary-glow: #3b82f6;
            --border-color: #cbd5e1;
            --success: #10b981;
            --danger: #ef4444;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #0b0f19;
                --card-bg: rgba(18, 24, 38, 0.95);
                --text-color: #f8fafc;
                --text-muted: #94a3b8;
                --primary: #3b82f6;
                --primary-glow: #60a5fa;
                --border-color: #1e293b;
            }
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 750px;
        }

        .header {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 20px 24px;
            margin-bottom: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 0 20px rgba(37, 99, 235, 0.15);
        }

        .header h1 {
            margin: 0;
            font-size: 1.3rem;
            font-weight: 800;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.05);
        }

        .student-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .student-details h3 {
            margin: 0 0 6px 0;
            font-size: 1.1rem;
        }

        .student-details p {
            margin: 0;
            font-size: 0.88rem;
            color: var(--text-muted);
        }

        .btn-group {
            display: flex;
            gap: 8px;
        }

        .btn {
            padding: 8px 16px;
            border-radius: 8px;
            border: none;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-accept {
            background-color: var(--success);
            color: #ffffff;
        }

        .btn-accept:hover {
            box-shadow: 0 0 10px var(--success);
        }

        .btn-reject {
            background-color: var(--danger);
            color: #ffffff;
        }

        .btn-reject:hover {
            box-shadow: 0 0 10px var(--danger);
        }

        .footer-credits {
            text-align: center;
            margin-top: 30px;
            font-size: 0.8rem;
            color: var(--text-muted);
            border-top: 1px solid var(--border-color);
            padding-top: 16px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>⚙️ لوحة إدارة الطلاب والطلبات</h1>
            <a href="index.html" style="color: var(--primary); text-decoration: none; font-size: 0.9rem; font-weight: 600;">تسجيل الخروج</a>
        </div>

        <div class="card">
            <div class="student-info">
                <div class="student-details">
                    <h3>طلب انضمام جديد</h3>
                    <p>متابعة الطلبات الواردة مباشرة عبر بوت التليجرام الخاص بك.</p>
                </div>
                <div class="btn-group">
                    <a href="https://t.me/CapAbdo1" target="_blank" class="btn btn-accept" style="text-decoration: none; display: inline-block;">فتح البوت والأدمن</a>
                </div>
            </div>
        </div>

        <div class="footer-credits">
            تطوير المهندس عبدالناصر © 2026
        </div>
    </div>

</body>
</html>
