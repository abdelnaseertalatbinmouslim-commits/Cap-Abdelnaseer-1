<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم | منصة الكوتش</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background: #0b0f19; color: #fff; font-family: sans-serif; padding: 20px; }
        h1 { color: #00e5ff; text-align: center; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: rgba(255,255,255,0.05); }
        th, td { padding: 12px; border: 1px solid rgba(255,255,255,0.1); text-align: center; }
        th { background: rgba(0,229,255,0.2); }
        .btn-approve { background: #2ed573; color: #000; padding: 6px 12px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .btn-reject { background: #ff4757; color: #fff; padding: 6px 12px; border: none; border-radius: 5px; cursor: pointer; margin-right: 5px; }
    </style>
</head>
<body>

    <h1>⚙️ لوحة إدارة منصة الكوتش</h1>

    <table>
        <thead>
            <tr>
                <th>الاسم</th>
                <th>الفرقة</th>
                <th>الهاتف</th>
                <th>الحالة</th>
                <th>كود المرور (PIN)</th>
                <th>إجراءات</th>
            </tr>
        </thead>
        <tbody id="studentsTable">
            <tr><td colspan="6">جاري تحميل البيانات من السحابة...</td></tr>
        </tbody>
    </table>

<script>
    const SUPABASE_URL = "https://qvkpeoqbmoqczfjjexfs.supabase.com";
    const SUPABASE_KEY = "sb_publishable_VpMTCDC7K8W4DcOc1-Y48w_ykbjl94q";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // 1. جلب قائمة الطلاب من قاعدة البيانات السحابية
    async function loadStudents() {
        const { data: students, error } = await supabaseClient
            .from('students')
            .select('*')
            .order('id', { ascending: false });

        const tableBody = document.getElementById('studentsTable');
        tableBody.innerHTML = '';

        if (error || !students || students.length === 0) {
            tableBody.innerHTML = '<tr><td colspan="6">لا يوجد طلبات تسجيل حالياً.</td></tr>';
            return;
        }

        students.forEach(student => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${student.name}</td>
                <td>${student.grade}</td>
                <td><a href="https://wa.me/2${student.phone}" target="_blank" style="color:#00e5ff">${student.phone}</a></td>
                <td>${student.status === 'approved' ? '✅ مقبول' : '⏳ قيد الانتظار'}</td>
                <td><b>${student.pin || '---'}</b></td>
                <td>
                    ${student.status !== 'approved' ? `
                        <button class="btn-approve" onclick="approveStudent('${student.id}')">قبول وتوليد كود</button>
                    ` : 'مفعل'}
                    <button class="btn-reject" onclick="deleteStudent('${student.id}')">حذف</button>
                </td>
            `;
            tableBody.appendChild(tr);
        });
    }

    // 2. قبول الطالب وتوليد كود مرور تلقائي له في السحابة
    async function approveStudent(id) {
        const generatedPin = Math.floor(1000 + Math.random() * 9000).toString(); // كود عشوائي من 4 أرقام

        const { error } = await supabaseClient
            .from('students')
            .update({ status: 'approved', pin: generatedPin })
            .eq('id', id);

        if (error) {
            alert("حدث خطأ أثناء قبول الطالب");
        } else {
            alert(`تم قبول الطالب بنجاح! كود المرور الخاص به هو: ${generatedPin}`);
            loadStudents();
        }
    }

    // 3. حذف الطالب من السحابة
    async function deleteStudent(id) {
        if (confirm("هل أنت تأكد من حذف هذا الطالب؟")) {
            const { error } = await supabaseClient
                .from('students')
                .delete()
                .eq('id', id);

            if (!error) loadStudents();
        }
    }

    // تحميل البيانات عند فتح الصفحة مباشرة
    loadStudents();
</script>
</body>
</html>
