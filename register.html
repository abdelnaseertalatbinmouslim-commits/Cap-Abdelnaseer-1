                                        <input

                                            autocomplete="name"
                                            placeholder="اكتب اسمك بالكامل"
                                            maxlength="120"
                                            required
                                        >

                                    <small
                                        class="field-error"

                                        aria-live="polite"
                                    ></small>

                                </div>


                                <!-- PHONE -->

                                    <label for="registerPhone">
                                        رقم الهاتف
                                    </label>

                                    <div class="input-wrap">

                                        <span

                                            aria-hidden="true"
                                        >
                                            ☎

                                        <input
                                            type="tel"
                                            id="registerPhone"
                                            name="phone"
                                            autocomplete="tel"
                                            inputmode="tel"
                                            placeholder="اكتب رقم الهاتف"
                                            maxlength="20"
                                            required

                                    <small

                                        id="registerPhoneError"
                                        aria-live="polite"

                                </div>


                                <!-- EMAIL -->

                                    <label for="registerEmail">
                                        البريد الإلكتروني

                                    <div class="input-wrap">

                                        <span
                                            class="input-icon"
                                            aria-hidden="true"
                                        >
                                            @
                                        </span>

                                        <input
                                            type="email"
                                            id="registerEmail"
                                            name="email"
                                            autocomplete="email"
                                            inputmode="email"
                                            placeholder="اكتب البريد الإلكتروني"
                                            maxlength="160"
                                            required
                                        >

                                    </div>

                                    <small
                                        class="field-error"

                                        aria-live="polite"
                                    ></small>

                                </div>


                                <!-- STUDENT ID -->

                                        رقم الطالب

                                            aria-hidden="true"

                                            #

                                        <input
                                            type="text"
                                            id="registerStudentId"
                                            name="studentId"
                                            autocomplete="off"
                                            placeholder="اكتب رقم الطالب إن وجد"

                                </div>


                                <!-- GRADE -->

                                        الفرقة الدراسية

                                    <div class="input-wrap">

                                        <span
                                            class="input-icon"
                                            aria-hidden="true"
                                        >
                                            ◈

                                        <select
                                            id="registerGrade"
                                            name="grade"
                                            autocomplete="off"
                                        >
                                            <option value="">
                                                اختر الفرقة

                                            <option value="الأولى">
                                                الفرقة الأولى
                                            </option>

                                            <option value="الثانية">
                                                الفرقة الثانية
                                            </option>

                                            <option value="الثالثة">
                                                الفرقة الثالثة

                                            </option>
                                        </select>

                                <!-- PASSWORD -->

    <!-- ==================================================
         REGISTER PAGE LOGIC
    =================================================== -->

    <script>
        "use strict";

        let registerSubmitting = false;

        const $ = (selector, parent = document) =>
            parent.querySelector(selector);


        function storageGet(key) {
            try {
                return localStorage.getItem(key);
            } catch (error) {
                return null;
            }
        }


        function storageSet(key, value) {
            try {
                localStorage.setItem(key, value);
            } catch (error) {}
        }


        /* =========================
           THEME
        ========================== */

        function initializeTheme() {

            const toggle = $("#themeToggle");

            const savedTheme =
                storageGet("coach_platform_theme");

            const theme =
                savedTheme === "light" ||
                savedTheme === "dark"
                    ? savedTheme
                    : "dark";

            applyTheme(theme, false);


            if (toggle) {

                toggle.addEventListener(
                    "click",
                    () => {

                        const current =
                            document.documentElement
                                .getAttribute("data-theme") ||
                            "dark";

                        applyTheme(
                            current === "dark"
                                ? "light"
                                : "dark",
                            true
                        );

                    }
                );

            }

        }


        function applyTheme(theme, save = true) {

            const normalized =
                theme === "light"
                    ? "light"
                    : "dark";


            document.documentElement.setAttribute(
                "data-theme",
                normalized
            );


            document.body.classList.toggle(
                "light-theme",
                normalized === "light"
            );


            document.body.classList.toggle(
                "dark-theme",
                normalized === "dark"
            );


            const toggle = $("#themeToggle");


            if (toggle) {

                toggle.setAttribute(
                    "aria-pressed",
                    String(normalized === "light")
                );


                toggle.setAttribute(
                    "aria-label",
                    normalized === "light"
                        ? "تفعيل الوضع الداكن"
                        : "تفعيل الوضع الفاتح"
                );

            }


            if (save) {

                storageSet(
                    "coach_platform_theme",
                    normalized
                );

            }

        }


        /* =========================
           TOAST
        ========================== */

        function showToast(
            message,
            type = "info"
        ) {

            const container =
                $("#toastContainer");


            if (!container) {
                return;
            }


            const toast =
                document.createElement("div");

            toast.className =
                `toast toast-${type}`;


            const text =
                document.createElement("span");

            text.className =
                "toast-message";

            text.textContent =
                message;


            toast.appendChild(text);
            container.appendChild(toast);


            requestAnimationFrame(() => {
                toast.classList.add("show");
            });


            setTimeout(() => {

                toast.classList.remove("show");


                setTimeout(() => {
                    toast.remove();
                }, 300);

            }, 3500);

        }


        /* =========================
           MESSAGE
        ========================== */

        function setMessage(
            message,
            type = ""
        ) {

            const element =
                $("#registerMessage");


            if (!element) {
                return;
            }


            element.textContent =
                message || "";


            element.className =
                `form-message ${type}`;

        }


        function setFieldError(
            id,
            message
        ) {

            const element =
                $("#" + id);


            if (!element) {
                return;
            }


            element.textContent =
                message || "";

        }


        /* =========================
           VALIDATION
        ========================== */

        function validateEmail(email) {

            return /^[^\s@]+@[^\s@]+\.[^\s@]+$/
                .test(email);

        }


        function validatePhone(phone) {

            const normalized =
                phone.replace(/[^\d+]/g, "");

            return normalized.length >= 8 &&
                   normalized.length <= 20;

        }


        function validateRegister(
            name,
            phone,
            email,
            studentId,
            grade,
            password,
            confirmPassword
        ) {

            const errorFields = [
                "registerNameError",
                "registerPhoneError",
                "registerEmailError",
                "registerStudentIdError",
                "registerGradeError",
                "registerPasswordError",
                "registerConfirmPasswordError"
            ];


            errorFields.forEach(
                id => setFieldError(id, "")
            );


            if (!name) {

                setFieldError(
                    "registerNameError",
                    "من فضلك اكتب الاسم بالكامل."
                );

                return false;

            }


            if (name.length < 3) {

                setFieldError(
                    "registerNameError",
                    "الاسم يجب أن يكون 3 أحرف على الأقل."
                );

                return false;

            }


            if (!phone) {

                setFieldError(
                    "registerPhoneError",
                    "من فضلك اكتب رقم الهاتف."
                );

                return false;

            }


            if (!validatePhone(phone)) {

                setFieldError(
                    "registerPhoneError",
                    "اكتب رقم هاتف صحيحًا."
                );

                return false;

            }


            if (!email) {

                setFieldError(
                    "registerEmailError",
                    "من فضلك اكتب البريد الإلكتروني."
                );

                return false;

            }


            if (!validateEmail(email)) {

                setFieldError(
                    "registerEmailError",
                    "اكتب بريدًا إلكترونيًا صحيحًا."
                );

                return false;

            }


            if (!password) {

                setFieldError(
                    "registerPasswordError",
                    "من فضلك اكتب كلمة المرور."
                );

                return false;

            }


            if (password.length < 6) {

                setFieldError(
                    "registerPasswordError",
                    "كلمة المرور يجب أن تكون 6 أحرف على الأقل."
                );

                return false;

            }


            if (!confirmPassword) {

                setFieldError(
                    "registerConfirmPasswordError",
                    "من فضلك أكد كلمة المرور."
                );

                return false;

            }


            if (password !== confirmPassword) {

                setFieldError(
                    "registerConfirmPasswordError",
                    "كلمتا المرور غير متطابقتين."
                );

                return false;

            }


            return true;

        }


        /* =========================
           SUBMIT STATE
        ========================== */

        function setSubmitting(state) {

            const button =
                $("#registerSubmit");


            if (!button) {
                return;
            }


            registerSubmitting =
                state;


            button.disabled =
                state;


            if (state) {

                button.dataset.originalText =
                    button.textContent;

                button.textContent =
                    "جاري إرسال طلب التسجيل...";

            } else {

                button.textContent =
                    button.dataset.originalText ||
                    "إرسال طلب التسجيل";

            }

        }


        /* =========================
           FIREBASE ERROR
        ========================== */

        function getFirebaseErrorMessage(
            error
        ) {

            if (
                window.FirebaseAuth &&
                typeof window.FirebaseAuth
                    .getErrorMessage ===
                "function"
            ) {

                return window.FirebaseAuth
                    .getErrorMessage(error);

            }


            if (
                window.FirebaseCore &&
                typeof window.FirebaseCore
                    .getErrorMessage ===
                "function"
            ) {

                return window.FirebaseCore
                    .getErrorMessage(error);

            }


            return "تعذر إنشاء الحساب. حاول مرة أخرى.";

        }


        /* =========================
           CREATE FIREBASE ACCOUNT
        ========================== */

        async function createAccount(
            email,
            password
        ) {

            if (
                !window.FirebaseAuth ||
                typeof window.FirebaseAuth
                    .registerWithEmail !==
                "function"
            ) {

                throw new Error(
                    "Firebase Authentication is not available."
                );

            }


            return window.FirebaseAuth
                .registerWithEmail(
                    email,
                    password
                );

        }


        /* =========================
           CREATE PENDING REQUEST
        ========================== */

        async function createPendingRequest(
            user,
            data
        ) {

            if (
                !window.FirebaseDatabase ||
                typeof window.FirebaseDatabase
                    .push !== "function"
            ) {

                throw new Error(
                    "Firebase Database is not available."
                );

            }


            const request = {

                uid:
                    user?.uid || "",

                userId:
                    user?.uid || "",

                email:
                    data.email || "",

                name:
                    data.name || "",

                studentName:
                    data.name || "",

                phone:
                    data.phone || "",

                studentId:
                    data.studentId || "",

                grade:
                    data.grade || "",

                status:
                    "pending",

                approvalStatus:
                    "pending",

                accountStatus:
                    "pending",

                createdAt:
                    window.FirebaseCore
                        ?.serverTimestamp?.() ||
                    Date.now(),

                updatedAt:
                    window.FirebaseCore
                        ?.serverTimestamp?.() ||
                    Date.now(),

                source:
                    "register.html"

            };


            /*
             * الطلبات الجديدة تكون منفصلة عن
             * بيانات الطلاب القديمة.
             *
             * لا يوجد حذف أو overwrite لسجل
             * موجود مسبقًا.
             */

            return window.FirebaseDatabase
                .push(
                    "registrationRequests",
                    request
                );

        }


        /* =========================
           UPDATE AUTH PROFILE
        ========================== */

        async function updateAuthProfile(
            name
        ) {

            try {

                if (
                    window.FirebaseAuth &&
                    typeof window.FirebaseAuth
                        .updateDisplayName ===
                    "function"
                ) {

                    await window.FirebaseAuth
                        .updateDisplayName(name);

                }

            } catch (error) {

                console.warn(
                    "Display name update skipped:",
                    error
                );

            }

        }


        /* =========================
           SEND VERIFICATION
        ========================== */

        async function sendVerification() {

            try {

                if (
                    window.FirebaseAuth &&
                    typeof window.FirebaseAuth
                        .sendEmailVerification ===
                    "function"
                ) {

                    await window.FirebaseAuth
                        .sendEmailVerification();

                }

            } catch (error) {

                console.warn(
                    "Email verification skipped:",
                    error
                );

            }

        }


        /* =========================
           REGISTER
        ========================== */

        async function handleRegister(
            event
        ) {

            event.preventDefault();


            if (registerSubmitting) {
                return;
            }


            const name =
                $("#registerName")
                    ?.value
                    .trim() || "";


            const phone =
                $("#registerPhone")
                    ?.value
                    .trim() || "";


            const email =
                $("#registerEmail")
                    ?.value
                    .trim()
                    .toLowerCase() || "";


            const studentId =
                $("#registerStudentId")
                    ?.value
                    .trim() || "";


            const grade =
                $("#registerGrade")
                    ?.value
                    .trim() || "";


            const password =
                $("#registerPassword")
                    ?.value || "";


            const confirmPassword =
                $("#registerConfirmPassword")
                    ?.value || "";


            if (
                !validateRegister(
                    name,
                    phone,
                    email,
                    studentId,
                    grade,
                    password,
                    confirmPassword
                )
            ) {

                return;

            }


            setMessage("", "");

            setSubmitting(true);


            try {

                /*
                 * 1. إنشاء حساب Firebase Auth.
                 */

                const result =
                    await createAccount(
                        email,
                        password
                    );


                const user =
                    result?.user ||
                    window.FirebaseAuth
                        ?.getCurrentUser?.();


                if (!user) {

                    throw new Error(
                        "تم إنشاء الحساب ولكن لم يتم العثور على المستخدم."
                    );

                }


                /*
                 * 2. تحديث اسم المستخدم في Auth.
                 */

                await updateAuthProfile(name);


                /*
                 * 3. إنشاء طلب تسجيل Pending.
                 */

                await createPendingRequest(
                    user,
                    {
                        name,
                        phone,
                        email,
                        studentId,
                        grade
                    }
                );


                /*
                 * 4. إرسال تأكيد البريد إن أمكن.
                 */

                await sendVerification();


                /*
                 * حفظ توافق مع النظام القديم.
                 */

                storageSet(
                    "coach_platform_remembered_login",
                    "true"
                );


                /*
                 * لا يتم إعطاء حالة approved
                 * من الواجهة.
                 */

                setMessage(
                    "تم إرسال طلب التسجيل بنجاح. حسابك الآن قيد المراجعة من الإدارة.",
                    "success"
                );


                showToast(
                    "تم إرسال طلب التسجيل بنجاح",
                    "success"
                );


                /*
                 * نترك وقتًا لظهور الرسالة ثم
                 * ننتقل لتسجيل الدخول.
                 */

                setTimeout(() => {

                    window.location.href =
                        "login.html";

                }, 1600);


            } catch (error) {

                console.error(
                    "Register error:",
                    error
                );


                const message =
                    getFirebaseErrorMessage(
                        error
                    );


                setMessage(
                    message,
                    "error"
                );


                showToast(
                    message,
                    "error"
                );

            } finally {

                setSubmitting(false);

            }

        }


        /* =========================
           PASSWORD TOGGLE
        ========================== */

        function initializePasswordToggle(
            buttonId,
            inputId
        ) {

            const button =
                $("#" + buttonId);

            const input =
                $("#" + inputId);


            if (!button || !input) {
                return;
            }


            button.addEventListener(
                "click",
                () => {

                    const showing =
                        input.type === "text";


                    input.type =
                        showing
                            ? "password"
                            : "text";


                    button.setAttribute(
                        "aria-pressed",
                        String(!showing)
                    );


                    button.setAttribute(
                        "aria-label",
                        showing
                            ? "إظهار كلمة المرور"
                            : "إخفاء كلمة المرور"
                    );

                }
            );

        }


        /* =========================
           REVEAL
        ========================== */

        function initializeReveal() {

            const elements =
                document.querySelectorAll(
                    ".reveal"
                );


            if (!elements.length) {
                return;
            }


            if (
                !("IntersectionObserver" in window)
            ) {

                elements.forEach(
                    element => {

                        element.classList.add(
                            "visible"
                        );

                        element.classList.add(
                            "revealed"
                        );

                    }
                );

                return;

            }


            const observer =
                new IntersectionObserver(
                    entries => {

                        entries.forEach(
                            entry => {

                                if (
                                    !entry.isIntersecting
                                ) {

                                    return;

                                }


                                entry.target.classList.add(
                                    "visible"
                                );


                                entry.target.classList.add(
                                    "revealed"
                                );


                                observer.unobserve(
                                    entry.target
                                );

                            }
                        );

                    },
                    {
                        threshold: 0.08
                    }
                );


            elements.forEach(
                element => {
                    observer.observe(element);
                }
            );

        }


        /* =========================
           INITIAL SESSION CHECK
        ========================== */

        function handleExistingSession() {

            try {

                if (
                    !window.FirebaseAuth ||
                    typeof window.FirebaseAuth
                        .getCurrentUser !==
                    "function"
                ) {

                    return;

                }


                const user =
                    window.FirebaseAuth
                        .getCurrentUser();


                if (!user) {
                    return;
                }


                /*
                 * لا يتم تحويل المستخدم تلقائيًا.
                 */

            } catch (error) {

                console.warn(
                    "Existing session check skipped:",
                    error
                );

            }

        }


        /* =========================
           INITIALIZE
        ========================== */

        function initializeRegisterPage() {

            initializeTheme();


            initializePasswordToggle(
                "passwordToggle",
                "registerPassword"
            );


            initializePasswordToggle(
                "confirmPasswordToggle",
                "registerConfirmPassword"
            );


            initializeReveal();


            const form =
                $("#registerForm");


            if (form) {

                form.addEventListener(
                    "submit",
                    handleRegister
                );

            }


            handleExistingSession();

        }


        if (
            document.readyState ===
            "loading"
        ) {

            document.addEventListener(
                "DOMContentLoaded",
                initializeRegisterPage,
                { once: true }
            );

        } else {

            initializeRegisterPage();

        }

    </script>
