<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مقررات الترم الأول | منصة الكابتن</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <div class="header-nav">
            <h1 class="page-title">📚 مقررات الترم الأول</h1>
            <a href="courses.html" class="back-btn">← العودة للرئيسية</a>
        </div>

        <div class="subjects-grid" id="term1SubjectsContainer">
            <div class="subject-card" style="text-align: center;">
                <p style="color: var(--text-muted); margin: 0;">جاري تحميل مواد الترم الأول...</p>
            </div>
        </div>

        <div class="footer-credits">
            تطوير المهندس عبدالناصر © 2026
        </div>
    </div>

    <script>
        const FIREBASE_URL = "https://abodaa-default-rtdb.firebaseio.com";

        document.addEventListener("DOMContentLoaded", () => {
            const studentGrade = localStorage.getItem('studentGrade') || 'الجميع';
            fetchTermSubjects(studentGrade);
            updateStudentActivity();
        });

        // تحديث نشاط الطالب في قاعدة البيانات
        async function updateStudentActivity() {
            const studentName = localStorage.getItem('studentName');
            if (!studentName) return;
            try {
                const res = await fetch(`${FIREBASE_URL}/students.json`);
                const students = await res.json();
                if (students) {
                    let studentKey = null;
                    Object.keys(students).forEach(key => {
                        if (students[key].name === studentName) {
                            studentKey = key;
                        }
                    });
                    if (studentKey) {
                        const now = new Date().toLocaleString('ar-EG');
                        await fetch(`${FIREBASE_URL}/students/${studentKey}/lastActive.json`, {
                            method: 'PUT',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(now)
                        });
                    }
                }
            } catch (e) {
                console.error("خطأ في تحديث النشاط:", e);
            }
        }

        // دالة استخراج الـ ID الخاص بيوتيوب وتحويل الرابط لـ Embed تلقائياً
        function getYouTubeEmbedUrl(url) {
            if (!url) return '';
            let videoId = '';
            if (url.includes('youtu.be/')) {
                videoId = url.split('youtu.be/')[1]?.split('?')[0];
            } else if (url.includes('watch?v=')) {
                videoId = url.split('watch?v=')[1]?.split('&')[0];
            } else if (url.includes('embed/')) {
                return url; // لو الرابط متضمن جاهز
            }
            return videoId ? `https://www.youtube.com/embed/${videoId}` : url;
        }

        async function fetchTermSubjects(studentGrade) {
            try {
                const res = await fetch(`${FIREBASE_URL}/courses.json`);
                const courses = await res.json() || {};
                const container = document.getElementById('term1SubjectsContainer');
                
                container.innerHTML = '';
                const keys = Object.keys(courses);

                let foundCount = 0;

                keys.reverse().forEach(id => {
                    const c = courses[id];
                    if (c && c.term === 'الترم الأول' && (c.grade === 'الجميع' || c.grade === studentGrade)) {
                        foundCount++;
                        const embedUrl = getYouTubeEmbedUrl(c.link);

                        container.innerHTML += `
                            <div class="subject-card">
                                <div class="subject-head">
                                    <h3 class="subject-name">${c.title}</h3>
                                    <span class="subject-badge">الترم الأول</span>
                                </div>
                                <p class="subject-desc">${c.desc || 'محاضرات، ملخصات، واختبارات تفاعلية للمادة الدراسية.'}</p>
                                
                                <div class="video-container">
                                    <iframe src="${embedUrl}" title="${c.title}" allowfullscreen></iframe>
                                </div>

                                <a href="#" class="action-btn" style="display:none;"></a>
                            </div>
                        `;
                        
                        // تسجيل المشاهدة بمجرد ظهور الكارت في الصفحة
                        logContentView(c.title);
                    }
                });

                if (foundCount === 0) {
                    container.innerHTML = `
                        <div class="subject-card" style="text-align: center;">
                            <h3 class="subject-name" style="color: var(--text-muted); margin-bottom: 8px;">لا توجد مواد مضافة للترم الأول حالياً</h3>
                            <p class="subject-desc">سيتم إرفاق المواد الدراسية قريباً من قبل إدارة المنصة.</p>
                        </div>
                    `;
                }

            } catch (err) {
                console.error("خطأ في جلب بيانات الترم الأول:", err);
                document.getElementById('term1SubjectsContainer').innerHTML = `
                    <div class="subject-card" style="text-align: center;">
                        <h3 class="subject-name" style="color: #ef4444;">تعذر تحميل المقررات</h3>
                        <p class="subject-desc">تحقق من اتصالك بالإنترنت.</p>
                    </div>
                `;
            }
        }

        async function logContentView(subjectTitle) {
            const studentName = localStorage.getItem('studentName') || 'طالب غير معروف';
            const now = new Date().toLocaleString('ar-EG');
            
            const viewData = {
                studentName: studentName,
                contentTitle: `مادة الترم الأول: ${subjectTitle}`,
                viewedAt: now
            };

            try {
                await fetch(`${FIREBASE_URL}/content_views.json`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(viewData)
                });
            } catch (e) {
                console.error("خطأ في تسجيل المشاهدة:", e);
            }
        }
    </script>
</body>
</html>
