<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

    <link

    <link

    <link

        href="index.css"

</head>

<body>

    <!-- =========================
         BACKGROUND
    ========================== -->
    <div

        aria-hidden="true"

        <span class="background-orb background-orb-two"></span>
        <span class="background-grid"></span>
        <span class="background-noise"></span>
    </div>


    <!-- =========================
         HEADER
    ========================== -->
    <header class="site-header">

        <div class="container header-container">

            <a
                href="index.html"
                class="brand"
                aria-label="العودة إلى منصة الكوتش"
            >
                <span class="brand-mark">
                    <span></span>
                    <span></span>
                    <span></span>
                </span>

                <span class="brand-text">
                    <strong>منصة الكوتش</strong>
                    <small>تعلم • تطور • انجح</small>
                </span>
            </a>


            <div class="header-actions">

                <button
                    type="button"
                    class="theme-toggle"
                    id="themeToggle"
                    data-theme-toggle
                    aria-label="تغيير الوضع"
                    aria-pressed="false"
                >
                    <span
                        class="theme-icon theme-icon-sun"
                        aria-hidden="true"
                    >
                        ☀
                    </span>

                    <span
                        class="theme-icon theme-icon-moon"
                        aria-hidden="true"

                        ☾
                    </span>

                <a
                    href="index.html"
                    class="header-login-button"

                    الرئيسية

                <a

                    class="header-register-button"

                    إنشاء حساب
                </a>

            </div>

        </div>

    </header>


    <!-- =========================
         FORGOT PASSWORD
    ========================== -->
    <main>

        <section class="auth-section">

            <div class="container">

                <div class="auth-layout">

                    <!-- =====================
                         VISUAL SIDE
                    ====================== -->
                    <div class="auth-visual reveal">

                        <div
                            class="visual-glow"
                            aria-hidden="true"
                        ></div>


                        <div class="profile-orbit orbit-one"></div>
                        <div class="profile-orbit orbit-two"></div>


                        <div class="profile-badge profile-badge-top">
                            <span>SECURE</span>
                        </div>


                        <div class="profile-image-wrap">

                            <div class="profile-image-ring ring-one"></div>
                            <div class="profile-image-ring ring-two"></div>

                            <div class="profile-image">

                                <img
                                    src="1783950091830.jpg"
                                    alt="صورة الكوتش"
                                    class="hero-image"
                                    loading="eager"
                                    decoding="async"
                                >

                            </div>

                            <span class="profile-status"></span>

                        </div>


                        <div class="profile-floating-card card-one">

                            <span class="floating-icon">
                                ✦
                            </span>

                            <div>
                                <strong>أمان</strong>
                                <small>لحسابك</small>
                            </div>

                        </div>


                        <div class="profile-floating-card card-two">

                            <span class="floating-icon">
                                ◈
                            </span>

                            <div>
                                <strong>استرجاع</strong>
                                <small>بسهولة وأمان</small>
                            </div>

                        </div>

                    </div>


                    <!-- =====================
                         FORGOT CARD
                    ====================== -->
                    <div class="auth-card-wrap reveal">

                        <div class="auth-card">

                            <div class="auth-card-header">

                                <span class="section-kicker">
                                    RESET PASSWORD
                                </span>

                                <h1>
                                    نسيت كلمة المرور؟
                                </h1>

                                <p>
                                    اكتب بريدك الإلكتروني وسنرسل لك
                                    رابطًا لإعادة تعيين كلمة المرور.
                                </p>

                            </div>


                            <!-- =====================
                                 RESET FORM
                            ====================== -->
                            <form
                                id="forgotPasswordForm"
                                class="auth-form"
                                novalidate
                            >

                                <div class="form-group">

                                    <label for="forgotEmail">
                                        البريد الإلكتروني
                                    </label>

                                    <div class="input-wrap">

                                        <span
                                            class="input-icon"
                                            aria-hidden="true"
                                        >
                                            @
                                        </span>

                                        <input
                                            type="email"
                                            id="forgotEmail"
                                            name="email"
                                            autocomplete="email"
                                            inputmode="email"
                                            placeholder="اكتب البريد الإلكتروني"
                                            maxlength="160"
                                            required
                                        >

                                    </div>

                                    <small
                                        class="field-error"
                                        id="forgotEmailError"
                                        aria-live="polite"
                                    ></small>

                                </div>


                                <div
                                    id="forgotMessage"
                                    class="form-message"
                                    aria-live="polite"
                                    role="status"
                                ></div>


                                <button
                                    type="submit"
                                    id="forgotSubmit"
                                    class="modal-submit-button"
                                >
                                    إرسال رابط الاستعادة
                                </button>

                            </form>


                            <div class="auth-divider">
                                <span>أو</span>
                            </div>


                            <div class="auth-switch">

                                <span>
                                    تذكرت كلمة المرور؟
                                </span>

                                <a href="login.html">
                                    تسجيل الدخول
                                </a>

                            </div>


                            <div class="auth-switch">

                                <span>
                                    مش عندك حساب؟
                                </span>

                                <a href="register.html">
                                    إنشاء حساب جديد
                                </a>

                            </div>


                            <div class="auth-back-link">

                                <a href="index.html">
                                    <span>→</span>
                                    العودة إلى الرئيسية
                                </a>

                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </section>

    </main>


    <!-- =========================
         TOAST
    ========================== -->
    <div
        id="toastContainer"
        class="toast-container"
        aria-live="polite"
        aria-atomic="true"
    ></div>


    <!-- ==================================================
         FIREBASE SDK
    =================================================== -->

    <script
        src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"
    ></script>

    <script
        src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"
    ></script>

    <script
        src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"
    ></script>


    <!-- ==================================================
         FIREBASE PROJECT LAYERS
    =================================================== -->

    <script src="firebase-config.js"></script>
    <script src="firebase-auth.js"></script>
    <script src="firebase-database.js"></script>
    <script src="firebase-content.js"></script>
    <script src="firebase-features.js"></script>


    <!-- ==================================================
         FORGOT PASSWORD LOGIC
    ================================================== -->

    <script>
        "use strict";

        let forgotSubmitting = false;


        const $ = (
            selector,
            parent = document
        ) => parent.querySelector(selector);


        /* =========================
           STORAGE
        ========================== */

        function storageGet(key) {

            try {

                return localStorage.getItem(key);

            } catch (error) {

                return null;

            }

        }


        function storageSet(
            key,
            value
        ) {

            try {

                localStorage.setItem(
                    key,
                    value
                );

            } catch (error) {}

        }


        /* =========================
           THEME
        ========================== */

        function initializeTheme() {

            const toggle =
                $("#themeToggle");


            const savedTheme =
                storageGet(
                    "coach_platform_theme"
                );


            const theme =
                savedTheme === "light" ||
                savedTheme === "dark"
                    ? savedTheme
                    : "dark";


            applyTheme(
                theme,
                false
            );


            if (!toggle) {
                return;
            }


            toggle.addEventListener(
                "click",
                () => {

                    const current =
                        document.documentElement
                            .getAttribute(
                                "data-theme"
                            ) ||
                        "dark";


                    applyTheme(
                        current === "dark"
                            ? "light"
                            : "dark",
                        true
                    );

                }
            );

        }


        function applyTheme(
            theme,
            save = true
        ) {

            const normalized =
                theme === "light"
                    ? "light"
                    : "dark";


            document.documentElement
                .setAttribute(
                    "data-theme",
                    normalized
                );


            document.body.classList.toggle(
                "light-theme",
                normalized === "light"
            );


            document.body.classList.toggle(
                "dark-theme",
                normalized === "dark"
            );


            const toggle =
                $("#themeToggle");


            if (toggle) {

                toggle.setAttribute(
                    "aria-pressed",
                    String(
                        normalized === "light"
                    )
                );


                toggle.setAttribute(
                    "aria-label",
                    normalized === "light"
                        ? "تفعيل الوضع الداكن"
                        : "تفعيل الوضع الفاتح"
                );

            }


            if (save) {

                storageSet(
                    "coach_platform_theme",
                    normalized
                );

            }

        }


        /* =========================
           TOAST
        ========================== */

        function showToast(
            message,
            type = "info"
        ) {

            const container =
                $("#toastContainer");


            if (!container) {
                return;
            }


            const toast =
                document.createElement(
                    "div"
                );


            toast.className =
                `toast toast-${type}`;


            const text =
                document.createElement(
                    "span"
                );


            text.className =
                "toast-message";


            text.textContent =
                message;


            toast.appendChild(text);

            container.appendChild(toast);


            requestAnimationFrame(
                () => {

                    toast.classList.add(
                        "show"
                    );

                }
            );


            setTimeout(
                () => {

                    toast.classList.remove(
                        "show"
                    );


                    setTimeout(
                        () => {

                            toast.remove();

                        },
                        300
                    );

                },
                3500
            );

        }


        /* =========================
           MESSAGE
        ========================== */

        function setMessage(
            message,
            type = ""
        ) {

            const element =
                $("#forgotMessage");


            if (!element) {
                return;
            }


            element.textContent =
                message || "";


            element.className =
                `form-message ${type}`;

        }


        function setFieldError(
            id,
            message
        ) {

            const element =
                $("#" + id);


            if (!element) {
                return;
            }


            element.textContent =
                message || "";

        }


        /* =========================
           VALIDATION
        ========================== */

        function validateEmail(
            email
        ) {

            return /^[^\s@]+@[^\s@]+\.[^\s@]+$/
                .test(email);

        }


        function validateForgotPassword(
            email
        ) {

            setFieldError(
                "forgotEmailError",
                ""
            );


            if (!email) {

                setFieldError(
                    "forgotEmailError",
                    "من فضلك اكتب البريد الإلكتروني."
                );

                return false;

            }


            if (!validateEmail(email)) {

                setFieldError(
                    "forgotEmailError",
                    "اكتب بريدًا إلكترونيًا صحيحًا."
                );

                return false;

            }


            return true;

        }


        /* =========================
           SUBMIT STATE
        ========================== */

        function setSubmitting(
            state
        ) {

            const button =
                $("#forgotSubmit");


            if (!button) {
                return;
            }


            forgotSubmitting =
                state;


            button.disabled =
                state;


            if (state) {

                button.dataset.originalText =
                    button.textContent;


                button.textContent =
                    "جاري إرسال الرابط...";

            } else {

                button.textContent =
                    button.dataset.originalText ||
                    "إرسال رابط الاستعادة";

            }

        }


        /* =========================
           FIREBASE ERROR
        ========================== */

        function getFirebaseErrorMessage(
            error
        ) {

            if (
                window.FirebaseAuth &&
                typeof window.FirebaseAuth
                    .getErrorMessage ===
                "function"
            ) {

                return window.FirebaseAuth
                    .getErrorMessage(
                        error
                    );

            }


            if (
                window.FirebaseCore &&
                typeof window.FirebaseCore
                    .getErrorMessage ===
                "function"
            ) {

                return window.FirebaseCore
                    .getErrorMessage(
                        error
                    );

            }


            return "تعذر إرسال رابط استعادة كلمة المرور. حاول مرة أخرى.";

        }


        /* =========================
           SEND RESET EMAIL
        ========================== */

        async function sendResetEmail(
            email
        ) {

            if (
                !window.FirebaseAuth ||
                typeof window.FirebaseAuth
                    .sendPasswordResetEmail !==
                "function"
            ) {

                throw new Error(
                    "Firebase Authentication is not available."
                );

            }


            return window.FirebaseAuth
                .sendPasswordResetEmail(
                    email
                );

        }


        /* =========================
           FORM HANDLER
        ========================== */

        async function handleForgotPassword(
            event
        ) {

            event.preventDefault();


            if (forgotSubmitting) {
                return;
            }


            const email =
                $("#forgotEmail")
                    ?.value
                    .trim()
                    .toLowerCase() || "";


            if (
                !validateForgotPassword(
                    email
                )
            ) {

                return;

            }


            setMessage(
                "",
                ""
            );


            setSubmitting(
                true
            );


            try {

                await sendResetEmail(
                    email
                );


                setMessage(
                    "تم إرسال رابط استعادة كلمة المرور إلى بريدك الإلكتروني. افحص البريد الوارد ومجلد الرسائل غير المرغوب فيها.",
                    "success"
                );


                showToast(
                    "تم إرسال رابط الاستعادة",
                    "success"
                );


                /*
                 * تفريغ الحقل بعد نجاح الإرسال
                 * لتجنب إرسال نفس الطلب بالخطأ.
                 */

                const input =
                    $("#forgotEmail");


                if (input) {

                    input.value = "";

                }


            } catch (error) {

                console.error(
                    "Password reset error:",
                    error
                );


                const message =
                    getFirebaseErrorMessage(
                        error
                    );


                setMessage(
                    message,
                    "error"
                );


                showToast(
                    message,
                    "error"
                );

            } finally {

                setSubmitting(
                    false
                );

            }

        }


        /* =========================
           REVEAL
        ========================== */

        function initializeReveal() {

            const elements =
                document.querySelectorAll(
                    ".reveal"
                );


            if (!elements.length) {
                return;
            }


            if (
                !(
                    "IntersectionObserver"
                    in window
                )
            ) {

                elements.forEach(
                    element => {

                        element.classList.add(
                            "visible"
                        );

                        element.classList.add(
                            "revealed"
                        );

                    }
                );

                return;

            }


            const observer =
                new IntersectionObserver(
                    entries => {

                        entries.forEach(
                            entry => {

                                if (
                                    !entry.isIntersecting
                                ) {

                                    return;

                                }


                                entry.target.classList.add(
                                    "visible"
                                );


                                entry.target.classList.add(
                                    "revealed"
                                );


                                observer.unobserve(
                                    entry.target
                                );

                            }
                        );

                    },
                    {
                        threshold: 0.08
                    }
                );


            elements.forEach(
                element => {

                    observer.observe(
                        element
                    );

                }
            );

        }


        /* =========================
           INITIALIZE
        ========================== */

        function initializeForgotPasswordPage() {

            initializeTheme();

            initializeReveal();


            const form =
                $("#forgotPasswordForm");


            if (form) {

                form.addEventListener(
                    "submit",
                    handleForgotPassword
                );

            }

        }


        if (
            document.readyState ===
            "loading"
        ) {

            document.addEventListener(
                "DOMContentLoaded",
                initializeForgotPasswordPage,
                {
                    once: true
                }
            );

        } else {

            initializeForgotPasswordPage();

        }

    </script>

</body>
</html>
