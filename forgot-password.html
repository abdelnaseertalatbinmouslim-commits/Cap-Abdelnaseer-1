<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <meta
        name="description"
        content="استرجاع بيانات الدخول إلى منصة Cap Abdelnaseer"
    >

    <meta name="theme-color" content="#070a10">

    <title>استرجاع الحساب | Cap Abdelnaseer</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet"
    >


    <style>

        /* =========================================================
           CAP ABDELNASEER
           FORGOT PASSWORD PAGE
           ========================================================= */

        :root {

            --bg: #070a10;
            --card: rgba(16, 22, 34, 0.90);
            --card-border: rgba(255, 255, 255, 0.08);

            --primary: #6c63ff;
            --primary-dark: #5148e8;
            --primary-soft: rgba(108, 99, 255, 0.15);

            --text: #ffffff;
            --text-soft: #aeb7c8;
            --text-muted: #727d91;

            --success: #31d07c;
            --danger: #ff5f6d;
            --warning: #ffbd4a;

            --input: rgba(255, 255, 255, 0.045);
            --input-border: rgba(255, 255, 255, 0.09);

            --radius-lg: 26px;
            --radius-sm: 12px;

            --shadow:
                0 30px 80px rgba(0, 0, 0, 0.42);
        }


        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        html {
            scroll-behavior: smooth;
        }


        body {

            min-height: 100vh;

            font-family:
                "Cairo",
                sans-serif;

            color:
                var(--text);

            background:

                radial-gradient(
                    circle at 15% 20%,
                    rgba(108, 99, 255, 0.13),
                    transparent 28%
                ),

                radial-gradient(
                    circle at 85% 80%,
                    rgba(108, 99, 255, 0.08),
                    transparent 30%
                ),

                var(--bg);

            overflow-x: hidden;
        }


        button,
        input {
            font-family: inherit;
        }


        button {
            cursor: pointer;
        }


        a {
            color: inherit;
            text-decoration: none;
        }


        /* =========================================================
           BACKGROUND
           ========================================================= */

        .background {

            position: fixed;

            inset: 0;

            z-index: 0;

            pointer-events: none;

            overflow: hidden;
        }


        .orb {

            position: absolute;

            border-radius: 50%;

            filter: blur(80px);

            opacity: 0.25;
        }


        .orb-one {

            width: 320px;
            height: 320px;

            top: -130px;
            right: -80px;

            background:
                #6c63ff;
        }


        .orb-two {

            width: 260px;
            height: 260px;

            bottom: -100px;
            left: -80px;

            background:
                #5148e8;
        }


        .grid {

            position: absolute;

            inset: 0;

            background-image:

                linear-gradient(
                    rgba(255,255,255,0.018) 1px,
                    transparent 1px
                ),

                linear-gradient(
                    90deg,
                    rgba(255,255,255,0.018) 1px,
                    transparent 1px
                );

            background-size:
                45px 45px;

            mask-image:
                linear-gradient(
                    to bottom,
                    black,
                    transparent 85%
                );
        }


        /* =========================================================
           HEADER
           ========================================================= */

        .topbar {

            position: relative;

            z-index: 5;

            width: 100%;

            padding:
                22px 28px;

            display:
                flex;

            align-items:
                center;

            justify-content:
                space-between;
        }


        .brand {

            display:
                inline-flex;

            align-items:
                center;

            gap:
                12px;

            font-size:
                20px;

            font-weight:
                900;
        }


        .brand-icon {

            width:
                42px;

            height:
                42px;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            border-radius:
                13px;

            background:

                linear-gradient(
                    135deg,
                    var(--primary),
                    #8a83ff
                );

            box-shadow:

                0 10px 30px
                rgba(108,99,255,0.25);
        }


        .brand-icon span {

            font-size:
                17px;

            font-weight:
                900;
        }


        .back-login {

            display:
                inline-flex;

            align-items:
                center;

            gap:
                8px;

            color:
                var(--text-soft);

            font-size:
                14px;

            font-weight:
                600;

            transition:
                0.25s ease;
        }


        .back-login:hover {

            color:
                white;

            transform:
                translateX(-3px);
        }


        /* =========================================================
           PAGE
           ========================================================= */

        .page {

            position:
                relative;

            z-index:
                2;

            min-height:
                calc(100vh - 86px);

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            padding:
                25px 18px 50px;
        }


        .wrapper {

            width:
                100%;

            max-width:
                470px;

            animation:
                pageIn 0.65s ease both;
        }


        @keyframes pageIn {

            from {

                opacity:
                    0;

                transform:
                    translateY(22px);
            }

            to {

                opacity:
                    1;

                transform:
                    translateY(0);
            }
        }


        /* =========================================================
           CARD
           ========================================================= */

        .card {

            position:
                relative;

            padding:
                38px;

            border:
                1px solid
                var(--card-border);

            border-radius:
                var(--radius-lg);

            background:

                linear-gradient(
                    145deg,
                    rgba(19,26,40,0.95),
                    rgba(10,14,23,0.95)
                );

            box-shadow:
                var(--shadow);

            backdrop-filter:
                blur(20px);

            -webkit-backdrop-filter:
                blur(20px);

            overflow:
                hidden;
        }


        .card::before {

            content:
                "";

            position:
                absolute;

            top:
                0;

            right:
                15%;

            width:
                70%;

            height:
                1px;

            background:

                linear-gradient(
                    90deg,
                    transparent,
                    rgba(108,99,255,0.8),
                    transparent
                );
        }


        .card::after {

            content:
                "";

            position:
                absolute;

            width:
                180px;

            height:
                180px;

            border-radius:
                50%;

            background:
                rgba(108,99,255,0.07);

            top:
                -100px;

            left:
                -80px;

            filter:
                blur(10px);

            pointer-events:
                none;
        }


        /* =========================================================
           HEADING
           ========================================================= */

        .heading {

            text-align:
                center;

            margin-bottom:
                27px;
        }


        .heading-icon {

            width:
                66px;

            height:
                66px;

            margin:
                0 auto 17px;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            border-radius:
                20px;

            background:
                var(--primary-soft);

            border:
                1px solid
                rgba(108,99,255,0.2);

            font-size:
                27px;

            box-shadow:

                0 15px 40px
                rgba(108,99,255,0.12);
        }


        .heading h1 {

            font-size:
                27px;

            line-height:
                1.4;

            font-weight:
                900;

            margin-bottom:
                7px;
        }


        .heading p {

            color:
                var(--text-muted);

            font-size:
                13px;

            line-height:
                1.9;
        }


        /* =========================================================
           MESSAGE
           ========================================================= */

        .message-box {

            display:
                none;

            margin-bottom:
                18px;

            padding:
                13px 14px;

            border-radius:
                12px;

            font-size:
                12px;

            line-height:
                1.8;

            animation:
                messageIn 0.25s ease;
        }


        .message-box.show {
            display: block;
        }


        .message-box.error {

            color:
                #ffb5bc;

            background:
                rgba(255,95,109,0.08);

            border:
                1px solid
                rgba(255,95,109,0.18);
        }


        .message-box.success {

            color:
                #a8efc7;

            background:
                rgba(49,208,124,0.08);

            border:
                1px solid
                rgba(49,208,124,0.18);
        }


        .message-box.warning {

            color:
                #ffe0a2;

            background:
                rgba(255,189,74,0.08);

            border:
                1px solid
                rgba(255,189,74,0.18);
        }


        @keyframes messageIn {

            from {

                opacity:
                    0;

                transform:
                    translateY(-5px);
            }

            to {

                opacity:
                    1;

                transform:
                    translateY(0);
            }
        }


        /* =========================================================
           FORM
           ========================================================= */

        .form-group {

            margin-bottom:
                20px;
        }


        .form-label {

            display:
                block;

            margin-bottom:
                9px;

            color:
                #dce2ed;

            font-size:
                13px;

            font-weight:
                700;
        }


        .input-wrapper {

            position:
                relative;
        }


        .input-icon {

            position:
                absolute;

            top:
                50%;

            right:
                15px;

            transform:
                translateY(-50%);

            color:
                var(--text-muted);

            font-size:
                17px;

            pointer-events:
                none;

            transition:
                0.25s ease;
        }


        .form-input {

            width:
                100%;

            height:
                55px;

            padding:
                0 47px 0 15px;

            border:
                1px solid
                var(--input-border);

            border-radius:
                var(--radius-sm);

            background:
                var(--input);

            color:
                white;

            outline:
                none;

            font-size:
                14px;

            transition:

                border-color 0.25s ease,
                box-shadow 0.25s ease,
                background 0.25s ease;
        }


        .form-input::placeholder {

            color:
                #626d80;
        }


        .form-input:hover {

            border-color:
                rgba(255,255,255,0.14);
        }


        .form-input:focus {

            border-color:
                rgba(108,99,255,0.8);

            background:
                rgba(108,99,255,0.055);

            box-shadow:

                0 0 0 4px
                rgba(108,99,255,0.09);
        }


        .input-wrapper:focus-within
        .input-icon {

            color:
                #8b84ff;
        }


        /* =========================================================
           INFORMATION BOX
           ========================================================= */

        .info-box {

            display:
                flex;

            align-items:
                flex-start;

            gap:
                10px;

            padding:
                14px;

            margin:
                4px 0 20px;

            border-radius:
                13px;

            background:
                rgba(108,99,255,0.055);

            border:
                1px solid
                rgba(108,99,255,0.12);

            color:
                var(--text-muted);

            font-size:
                11px;

            line-height:
                1.8;
        }


        .info-icon {

            flex:
                0 0 auto;

            width:
                27px;

            height:
                27px;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            border-radius:
                8px;

            background:
                rgba(108,99,255,0.12);

            color:
                #8b84ff;

            font-weight:
                800;
        }


        /* =========================================================
           BUTTON
           ========================================================= */

        .submit-button {

            width:
                100%;

            height:
                56px;

            border:
                0;

            border-radius:
                15px;

            color:
                white;

            background:

                linear-gradient(
                    135deg,
                    var(--primary),
                    #817aff
                );

            font-size:
                15px;

            font-weight:
                800;

            box-shadow:

                0 14px 32px
                rgba(108,99,255,0.22);

            transition:

                transform 0.2s ease,
                box-shadow 0.2s ease,
                opacity 0.2s ease;

            position:
                relative;

            overflow:
                hidden;
        }


        .submit-button::before {

            content:
                "";

            position:
                absolute;

            inset:
                0;

            background:

                linear-gradient(
                    90deg,
                    transparent,
                    rgba(255,255,255,0.12),
                    transparent
                );

            transform:
                translateX(-100%);

            transition:
                0.5s ease;
        }


        .submit-button:hover {

            transform:
                translateY(-2px);

            box-shadow:

                0 18px 40px
                rgba(108,99,255,0.3);
        }


        .submit-button:hover::before {

            transform:
                translateX(100%);
        }


        .submit-button:active {

            transform:
                translateY(0);
        }


        .submit-button:disabled {

            opacity:
                0.65;

            cursor:
                not-allowed;

            transform:
                none;
        }


        .button-content {

            position:
                relative;

            z-index:
                2;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            gap:
                9px;
        }


        /* =========================================================
           SPINNER
           ========================================================= */

        .spinner {

            width:
                19px;

            height:
                19px;

            border:
                2px solid
                rgba(255,255,255,0.35);

            border-top-color:
                white;

            border-radius:
                50%;

            animation:
                spin 0.7s linear infinite;
        }


        @keyframes spin {

            to {

                transform:
                    rotate(360deg);
            }
        }


        /* =========================================================
           DIVIDER
           ========================================================= */

        .divider {

            display:
                flex;

            align-items:
                center;

            gap:
                13px;

            margin:
                24px 0;
        }


        .divider::before,
        .divider::after {

            content:
                "";

            height:
                1px;

            flex:
                1;

            background:
                rgba(255,255,255,0.07);
        }


        .divider span {

            color:
                #5e6879;

            font-size:
                11px;
        }


        /* =========================================================
           LINKS
           ========================================================= */

        .links-box {

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            gap:
                8px;

            flex-wrap:
                wrap;

            padding:
                16px;

            border-radius:
                14px;

            background:
                rgba(255,255,255,0.025);

            border:
                1px solid
                rgba(255,255,255,0.05);

            color:
                var(--text-muted);

            font-size:
                12px;
        }


        .links-box a {

            color:
                #8c86ff;

            font-weight:
                800;

            transition:
                0.2s ease;
        }


        .links-box a:hover {

            color:
                #aaa6ff;
        }


        .links-separator {

            color:
                #414b5b;
        }


        /* =========================================================
           FOOTER
           ========================================================= */

        .page-footer {

            text-align:
                center;

            margin-top:
                18px;

            color:
                #525d6f;

            font-size:
                10px;
        }


        /* =========================================================
           TOAST
           ========================================================= */

        .toast-container {

            position:
                fixed;

            left:
                20px;

            bottom:
                20px;

            z-index:
                9999;

            display:
                flex;

            flex-direction:
                column;

            gap:
                10px;

            pointer-events:
                none;
        }


        .toast {

            min-width:
                260px;

            max-width:
                360px;

            padding:
                13px 16px;

            border-radius:
                13px;

            background:
                rgba(19,26,40,0.96);

            border:
                1px solid
                rgba(255,255,255,0.08);

            box-shadow:
                0 15px 45px
                rgba(0,0,0,0.35);

            color:
                white;

            font-size:
                12px;

            transform:
                translateY(15px);

            opacity:
                0;

            transition:
                0.3s ease;
        }


        .toast.show {

            transform:
                translateY(0);

            opacity:
                1;
        }


        /* =========================================================
           RESPONSIVE
           ========================================================= */

        @media (max-width: 600px) {

            .topbar {

                padding:
                    17px;
            }


            .brand {

                font-size:
                    17px;
            }


            .brand-icon {

                width:
                    38px;

                height:
                    38px;
            }


            .back-login {

                font-size:
                    11px;
            }


            .page {

                padding:
                    12px 12px 35px;
            }


            .card {

                padding:
                    27px 19px;

                border-radius:
                    21px;
            }


            .heading {

                margin-bottom:
                    23px;
            }


            .heading-icon {

                width:
                    58px;

                height:
                    58px;

                border-radius:
                    17px;
            }


            .heading h1 {

                font-size:
                    24px;
            }


            .heading p {

                font-size:
                    11px;
            }


            .form-input {

                height:
                    53px;
            }


            .submit-button {

                height:
                    54px;
            }


            .toast-container {

                left:
                    12px;

                right:
                    12px;

                bottom:
                    12px;
            }


            .toast {

                width:
                    100%;

                max-width:
                    none;
            }

        }


        @media (max-width: 380px) {

            .card {

                padding:
                    24px 16px;
            }

        }


        /* =========================================================
           ACCESSIBILITY
           ========================================================= */

        :focus-visible {

            outline:
                2px solid
                rgba(108,99,255,0.8);

            outline-offset:
                3px;
        }


        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {

                animation-duration:
                    0.01ms !important;

                animation-iteration-count:
                    1 !important;

                transition-duration:
                    0.01ms !important;

                scroll-behavior:
                    auto !important;
            }

        }

    </style>

</head>


<body>


    <!-- =========================================================
         BACKGROUND
         ========================================================= -->

    <div
        class="background"
        aria-hidden="true"
    >

        <div class="orb orb-one"></div>

        <div class="orb orb-two"></div>

        <div class="grid"></div>

    </div>


    <!-- =========================================================
         HEADER
         ========================================================= -->

    <header class="topbar">

        <a
            href="index.html"
            class="brand"
            aria-label="Cap Abdelnaseer"
        >

            <span class="brand-icon">
                <span>CA</span>
            </span>

            <span>
                Cap Abdelnaseer
            </span>

        </a>


        <a
            href="login.html"
            class="back-login"
        >

            <span>
                العودة لتسجيل الدخول
            </span>

            <span>
                ←
            </span>

        </a>

    </header>


    <!-- =========================================================
         MAIN
         ========================================================= -->

    <main class="page">

        <div class="wrapper">

            <section class="card">


                <!-- =================================================
                     HEADING
                     ================================================= -->

                <div class="heading">

                    <div
                        class="heading-icon"
                        aria-hidden="true"
                    >
                        🔑
                    </div>


                    <h1>
                        استرجاع الحساب
                    </h1>


                    <p>
                        لو نسيت كلمة المرور، ابعتلنا طلب استرجاع الحساب
                    </p>

                </div>


                <!-- =================================================
                     MESSAGE
                     ================================================= -->

                <div
                    id="messageBox"
                    class="message-box"
                    role="alert"
                    aria-live="polite"
                ></div>


                <!-- =================================================
                     INFO
                     ================================================= -->

                <div class="info-box">

                    <div class="info-icon">
                        i
                    </div>

                    <div>
                        اكتب رقم الهاتف المرتبط بحسابك.
                        سيتم إنشاء طلب استرجاع للمراجعة،
                        ولن يتم تغيير كلمة المرور مباشرة من هذه الصفحة.
                    </div>

                </div>


                <!-- =================================================
                     FORM
                     ================================================= -->

                <form
                    id="forgotForm"
                    novalidate
                    autocomplete="on"
                >


                    <!-- PHONE -->

                    <div class="form-group">

                        <label
                            class="form-label"
                            for="phone"
                        >
                            رقم الهاتف
                        </label>


                        <div class="input-wrapper">

                            <input
                                id="phone"
                                name="phone"
                                class="form-input"
                                type="tel"
                                inputmode="tel"
                                autocomplete="tel"
                                placeholder="مثال: 01012345678"
                                maxlength="20"
                                required
                            >


                            <span
                                class="input-icon"
                                aria-hidden="true"
                            >
                                ☎
                            </span>

                        </div>

                    </div>


                    <!-- EMAIL OPTIONAL -->

                    <div class="form-group">

                        <label
                            class="form-label"
                            for="email"
                        >
                            البريد الإلكتروني
                            <span
                                style="
                                    color:#626d80;
                                    font-size:10px;
                                    font-weight:500;
                                "
                            >
                                اختياري
                            </span>
                        </label>


                        <div class="input-wrapper">

                            <input
                                id="email"
                                name="email"
                                class="form-input"
                                type="email"
                                inputmode="email"
                                autocomplete="email"
                                placeholder="example@email.com"
                                maxlength="150"
                            >


                            <span
                                class="input-icon"
                                aria-hidden="true"
                            >
                                ✉
                            </span>

                        </div>

                    </div>


                    <!-- SUBMIT -->

                    <button
                        type="submit"
                        id="submitButton"
                        class="submit-button"
                    >

                        <span
                            id="buttonContent"
                            class="button-content"
                        >

                            <span>
                                إرسال طلب الاسترجاع
                            </span>

                            <span>
                                →
                            </span>

                        </span>

                    </button>


                </form>


                <!-- =================================================
                     DIVIDER
                     ================================================= -->

                <div class="divider">

                    <span>
                        أو
                    </span>

                </div>


                <!-- =================================================
                     LINKS
                     ================================================= -->

                <div class="links-box">

                    <a href="login.html">
                        تسجيل الدخول
                    </a>


                    <span class="links-separator">
                        •
                    </span>


                    <a href="register.html">
                        إنشاء حساب جديد
                    </a>

                </div>


            </section>


            <div class="page-footer">

                ©
                <span id="currentYear"></span>
                Cap Abdelnaseer

            </div>

        </div>

    </main>


    <!-- =========================================================
         TOAST
         ========================================================= -->

    <div
        id="toastContainer"
        class="toast-container"
        aria-live="polite"
        aria-atomic="true"
    ></div>


    <!-- =========================================================
         FIREBASE SDK
         ========================================================= -->

    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>

    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>

    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>


    <!-- =========================================================
         FIREBASE LAYERS
         ========================================================= -->

    <script src="firebase-config.js"></script>
    <script src="firebase-auth.js"></script>
    <script src="firebase-database.js"></script>
    <script src="firebase-content.js"></script>
    <script src="firebase-features.js"></script>


    <!-- =========================================================
         PAGE SCRIPT
         ========================================================= -->

    <script>

        (function () {

            "use strict";


            /* =====================================================
               ELEMENTS
               ===================================================== */

            const form =
                document.getElementById("forgotForm");

            const phoneInput =
                document.getElementById("phone");

            const emailInput =
                document.getElementById("email");

            const submitButton =
                document.getElementById("submitButton");

            const buttonContent =
                document.getElementById("buttonContent");

            const messageBox =
                document.getElementById("messageBox");

            const toastContainer =
                document.getElementById("toastContainer");

            const currentYear =
                document.getElementById("currentYear");


            /* =====================================================
               YEAR
               ===================================================== */

            currentYear.textContent =
                new Date().getFullYear();


            /* =====================================================
               ARABIC DIGITS
               ===================================================== */

            function normalizeArabicNumbers(value) {

                return String(value || "")

                    .replace(
                        /[٠-٩]/g,
                        function (digit) {

                            return String(
                                "٠١٢٣٤٥٦٧٨٩"
                                .indexOf(digit)
                            );

                        }
                    )

                    .replace(
                        /[۰-۹]/g,
                        function (digit) {

                            return String(
                                "۰۱۲۳۴۵۶۷۸۹"
                                .indexOf(digit)
                            );

                        }
                    );

            }


            /* =====================================================
               PHONE
               ===================================================== */

            function normalizePhone(value) {

                let phone =
                    normalizeArabicNumbers(
                        value
                    );


                phone =
                    phone
                    .replace(
                        /[^\d+]/g,
                        ""
                    )
                    .replace(
                        /\+/g,
                        function (match, offset) {

                            return offset === 0
                                ? "+"
                                : "";

                        }
                    );


                if (
                    phone.startsWith("+20")
                ) {

                    phone =
                        "0" +
                        phone.slice(3);

                }
                else if (
                    phone.startsWith("0020")
                ) {

                    phone =
                        "0" +
                        phone.slice(4);

                }
                else if (
                    phone.startsWith("20") &&
                    phone.length === 12
                ) {

                    phone =
                        "0" +
                        phone.slice(2);

                }
                else if (
                    /^\d{10}$/.test(phone)
                ) {

                    phone =
                        "0" +
                        phone;

                }


                return phone;

            }


            phoneInput.addEventListener(
                "input",
                function () {

                    phoneInput.value =
                        normalizeArabicNumbers(
                            phoneInput.value
                        );

                }
            );


            phoneInput.addEventListener(
                "blur",
                function () {

                    phoneInput.value =
                        normalizePhone(
                            phoneInput.value
                        );

                }
            );


            /* =====================================================
               MESSAGE
               ===================================================== */

            function showMessage(
                message,
                type
            ) {

                messageBox.textContent =
                    message;

                messageBox.className =
                    "message-box show " +
                    (
                        type ||
                        "error"
                    );

            }


            function hideMessage() {

                messageBox.textContent =
                    "";

                messageBox.className =
                    "message-box";

            }


            /* =====================================================
               TOAST
               ===================================================== */

            function showToast(message) {

                const toast =
                    document.createElement(
                        "div"
                    );

                toast.className =
                    "toast";

                toast.textContent =
                    message;

                toastContainer.appendChild(
                    toast
                );


                requestAnimationFrame(
                    function () {

                        toast.classList.add(
                            "show"
                        );

                    }
                );


                setTimeout(
                    function () {

                        toast.classList.remove(
                            "show"
                        );


                        setTimeout(
                            function () {

                                toast.remove();

                            },
                            300
                        );

                    },
                    3000
                );

            }


            /* =====================================================
               LOADING
               ===================================================== */

            function setLoading(
                loading
            ) {

                submitButton.disabled =
                    loading;


                if (loading) {

                    buttonContent.innerHTML =

                        '<span class="spinner"></span>' +
                        '<span>جاري إرسال الطلب...</span>';

                }
                else {

                    buttonContent.innerHTML =

                        '<span>إرسال طلب الاسترجاع</span>' +
                        '<span>→</span>';

                }

            }


            /* =====================================================
               WAIT FOR MODULES
               ===================================================== */

            async function waitForModules() {

                const timeout =
                    15000;

                const started =
                    Date.now();


                while (
                    Date.now() - started <
                    timeout
                ) {

                    if (
                        window.FirebaseAuthReady &&
                        window.FirebaseDatabaseReady
                    ) {

                        return true;

                    }


                    await new Promise(
                        function (resolve) {

                            setTimeout(
                                resolve,
                                100
                            );

                        }
                    );

                }


                return !!(
                    window.FirebaseAuth &&
                    window.FirebaseDatabase
                );

            }


            /* =====================================================
               ERROR MESSAGE
               ===================================================== */

            function getErrorMessage(
                error
            ) {

                if (!error) {

                    return "حدث خطأ غير متوقع، حاول مرة أخرى.";

                }


                const code =
                    String(
                        error.code ||
                        ""
                    ).toLowerCase();


                if (
                    code.includes("network") ||
                    code.includes("offline")
                ) {

                    return "تعذر الاتصال بالإنترنت. تأكد من الاتصال وحاول مرة أخرى.";

                }


                if (
                    code.includes("permission") ||
                    code.includes("permission-denied")
                ) {

                    return:
                        "لا يمكن إرسال الطلب حاليًا. حاول مرة أخرى.";

                }


                if (
                    code.includes("invalid")
                ) {

                    return:
                        "تأكد من صحة البيانات التي أدخلتها.";

                }


                if (error.message) {

                    return:
                        error.message;

                }


                return:
                    "تعذر إرسال طلب الاسترجاع. حاول مرة أخرى.";

            }


            /* =====================================================
               SUBMIT
               ===================================================== */

            form.addEventListener(
                "submit",
                async function (event) {

                    event.preventDefault();

                    hideMessage();


                    const phone =
                        normalizePhone(
                            phoneInput.value
                        );


                    const email =
                        String(
                            emailInput.value ||
                            ""
                        ).trim();


                    /* ---------------------------------------------
                       VALIDATE PHONE
                       --------------------------------------------- */

                    if (!phone) {

                        showMessage(
                            "من فضلك اكتب رقم الهاتف.",
                            "error"
                        );

                        phoneInput.focus();

                        return;

                    }


                    if (
                        !/^01[0125]\d{8}$/.test(phone)
                    ) {

                        showMessage(
                            "اكتب رقم هاتف مصري صحيح مثل 01012345678.",
                            "error"
                        );

                        phoneInput.focus();

                        return;

                    }


                    /* ---------------------------------------------
                       VALIDATE EMAIL
                       --------------------------------------------- */

                    if (email) {

                        const emailPattern =
                            /^[^\s@]+@[^\s@]+\.[^\s@]+$/;


                        if (
                            !emailPattern.test(
                                email
                            )
                        ) {

                            showMessage(
                                "اكتب بريدًا إلكترونيًا صحيحًا أو اتركه فارغًا.",
                                "error"
                            );

                            emailInput.focus();

                            return;

                        }

                    }


                    setLoading(true);


                    try {

                        const ready =
                            await waitForModules();


                        if (!ready) {

                            throw new Error(
                                "تعذر تحميل نظام الاسترجاع."
                            );

                        }


                        const auth =
                            window.FirebaseAuth;


                        if (
                            !auth ||
                            typeof auth.requestPasswordReset !==
                            "function"
                        ) {

                            throw new Error(
                                "نظام استرجاع الحساب غير جاهز."
                            );

                        }


                        /* -----------------------------------------
                           CREATE REQUEST
                           ----------------------------------------- */

                        await auth.requestPasswordReset(
                            phone,
                            email || ""
                        );


                        /* -----------------------------------------
                           SUCCESS
                           ----------------------------------------- */

                        showMessage(
                            "تم إرسال طلب استرجاع الحساب بنجاح. سيتم مراجعة الطلب والتواصل معك حسب نظام الدعم.",
                            "success"
                        );


                        showToast(
                            "تم إرسال طلب الاسترجاع"
                        );


                        form.reset();


                        setTimeout(
                            function () {

                                window.location.replace(
                                    "login.html"
                                );

                            },
                            2200
                        );


                    }
                    catch (error) {

                        console.error(
                            "Password reset request error:",
                            error
                        );


                        showMessage(
                            getErrorMessage(
                                error
                            ),
                            "error"
                        );


                        setLoading(false);

                    }

                }
            );


        })();

    </script>

</body>

</html>
