<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الكوتش | El-Coach Platform</title>

    <!-- مكتبات Firebase السحابية -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        :root {
            --bg-color: #080d1a;
            --card-bg: rgba(15, 23, 42, 0.95);
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #3b82f6;
            --primary-glow: rgba(59, 130, 246, 0.4);
            --border-color: #1e293b;
            --input-bg: #0f172a;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            padding: 16px;
            box-sizing: border-box;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .main-card {
            width: 100%;
            max-width: 440px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), 0 0 20px var(--primary-glow);
            backdrop-filter: blur(12px);
        }

        .logo-container { text-align: center; margin-bottom: 16px; }
        .logo-img {
            width: 110px;
            height: 110px;
            object-fit: cover;
            border-radius: 50%;
            border: 3px solid var(--primary);
            box-shadow: 0 0 20px var(--primary-glow);
        }

        .app-title {
            text-align: center;
            font-size: 1.8rem;
            font-weight: 800;
            margin: 8px 0 6px 0;
            color: #ffffff;
        }

        .app-subtitle {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.88rem;
            margin-bottom: 20px;
            line-height: 1.6;
        }

        /* حاوية الفيديو المرفوع بدلاً من الصورة */
        .video-wrapper {
            width: 100%;
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid var(--primary);
            box-shadow: 0 0 15px var(--primary-glow);
            margin-bottom: 22px;
            background: #000;
        }

        .video-wrapper video {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 20px;
            object-fit: cover;
        }

        .tab-buttons {
            display: flex;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 4px;
            margin-bottom: 20px;
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            border: none;
            background: transparent;
            color: var(--text-muted);
            font-weight: 700;
            font-size: 0.9rem;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .tab-btn.active {
            background: var(--primary);
            color: #ffffff;
            box-shadow: 0 0 12px var(--primary-glow);
        }

        .form-group { margin-bottom: 16px; text-align: right; }
        .form-group label { display: block; font-size: 0.85rem; font-weight: 700; margin-bottom: 6px; }
        .form-control {
            width: 100%;
            padding: 12px 14px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            background: var(--input-bg);
            color: var(--text-color);
            font-size: 0.95rem;
            box-sizing: border-box;
            outline: none;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, var(--primary), #1d4ed8);
            color: #ffffff;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 0 15px var(--primary-glow);
            margin-top: 8px;
        }

        .social-buttons { display: flex; gap: 10px; margin-top: 20px; }
        .social-btn {
            flex: 1;
            padding: 10px 4px;
            border-radius: 12px;
            text-decoration: none;
            text-align: center;
            font-size: 0.82rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .social-btn.wa { background: rgba(37, 211, 102, 0.15); color: #25D366; }
        .social-btn.tg { background: rgba(0, 136, 204, 0.15); color: #0088cc; }
        .social-btn.fb { background: rgba(24, 119, 242, 0.15); color: #1877F2; }

        .footer-credits {
            text-align: center;
            margin-top: 22px;
            font-size: 0.8rem;
            color: var(--text-muted);
            border-top: 1px solid var(--border-color);
            padding-top: 14px;
        }
    </style>
</head>
<body>

    <div class="main-card">
        <!-- الصورة الشخصية الدائرية بالأعلى -->
        <div class="logo-container">
            <img src="https://i.ibb.co/Xz95BGP/elcoach-logo.png" alt="الكوتش عبدالناصر" class="logo-img">
        </div>

        <h1 class="app-title">منصة الكوتش</h1>
        <p class="app-subtitle">🥇 الداعم الأول والمساعد الأكاديمي والرياضي لكل كباتن ورجال علوم الرياضة على مستوى الجمهورية.</p>

        <!-- عنصر الفيديو المرفوع (bebo123) بدلاً من الصورة المحددة -->
        <div class="video-wrapper">
            <video autoplay muted loop playsinline id="heroVideo">
                <source src="bebo123.mp4" type="video/mp4">
                <source src="bebo123" type="video/mp4">
                متصفحك لا يدعم تشغيل الفيديو.
            </video>
        </div>

        <div class="tab-buttons">
            <button class="tab-btn active" onclick="switchTab('register')">طلب انضمام جديد</button>
            <button class="tab-btn" onclick="switchTab('login')">تسجيل الدخول</button>
        </div>

        <!-- نموذج التسجيل -->
        <form id="registerForm" onsubmit="handleRegister(event)">
            <div class="form-group">
                <label>الاسم الثلاثي / الخماسي</label>
                <input type="text" id="regName" class="form-control" placeholder="أدخل اسمك بالكامل" required>
            </div>
            <div class="form-group">
                <label>الفرقة الدراسية</label>
                <select id="regGrade" class="form-control" required>
                    <option value="">اختر الفرقة الدراسية</option>
                    <option value="الفرقة الأولى">الفرقة الأولى</option>
                    <option value="الفرقة الثانية">الفرقة الثانية</option>
                    <option value="الفرقة الثالثة">الفرقة الثالثة</option>
                    <option value="الفرقة الرابعة">الفرقة الرابعة</option>
                </select>
            </div>
            <div class="form-group">
                <label>رقم الهاتف (واتساب)</label>
                <input type="tel" id="regPhone" class="form-control" placeholder="01xxxxxxxxx" required>
            </div>
            <button type="submit" id="btnReg" class="submit-btn">إرسال طلب الانضمام</button>
        </form>

        <!-- نموذج تسجيل الدخول -->
        <form id="loginForm" onsubmit="handleLogin(event)" style="display: none;">
            <div class="form-group">
                <label>رقم الهاتف / اسم المستخدم</label>
                <input type="text" id="loginPhone" class="form-control" placeholder="01xxxxxxxxx أو admin" required>
            </div>
            <div class="form-group">
                <label>كود المرور / PIN</label>
                <input type="password" id="loginPin" class="form-control" placeholder="أدخل كود المرور" required>
            </div>
            <button type="submit" class="submit-btn">تسجيل الدخول</button>
        </form>

        <!-- أزرار التواصل -->
        <div class="social-buttons">
            <a href="https://wa.me/201098227150" target="_blank" class="social-btn wa">واتساب</a>
            <a href="https://t.me/CapAbdo1" target="_blank" class="social-btn tg">تليجرام</a>
            <a href="https://www.facebook.com/cap.abdelnaseer.talat" target="_blank" class="social-btn fb">فيسبوك</a>
        </div>

        <div class="footer-credits">تطوير المهندس عبدالناصر © 2026</div>
    </div>

    <script>
        // إعدادات مشروع Firebase الخاصة بك
        const firebaseConfig = {
            apiKey: "AIzaSyAtRET95Dlp58sEPKm3g_nJ_90AQFme_P0",
            authDomain: "elcoach-a06cd.firebaseapp.com",
            databaseURL: "https://elcoach-a06cd-default-rtdb.firebaseio.com",
            projectId: "elcoach-a06cd",
            storageBucket: "elcoach-a06cd.firebasestorage.app",
            messagingSenderId: "1005781255562",
            appId: "1:1005781255562:web:8cfa840d88739de42cf473",
            measurementId: "G-4EC0Q65RK8"
        };

        // تهيئة Firebase
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        function switchTab(tab) {
            document.getElementById('registerForm').style.display = (tab === 'register') ? 'block' : 'none';
            document.getElementById('loginForm').style.display = (tab === 'login') ? 'block' : 'none';
            const btns = document.querySelectorAll('.tab-btn');
            btns[0].classList.toggle('active', tab === 'register');
            btns[1].classList.toggle('active', tab === 'login');
        }

        async function handleRegister(e) {
            e.preventDefault();
            const btn = document.getElementById('btnReg');
            btn.disabled = true;
            btn.innerText = "جاري الحفظ في السيرفر...";

            const name = document.getElementById('regName').value.trim();
            const grade = document.getElementById('regGrade').value;
            const phone = document.getElementById('regPhone').value.trim();

            try {
                const newReqRef = db.ref('pendingRequests').push();
                await newReqRef.set({
                    id: newReqRef.key,
                    name: name,
                    grade: grade,
                    phone: phone,
                    timestamp: Date.now()
                });

                alert("تم إرسال طلبك بنجاح وسيتواصل معك الكوتش قريبًا!");
                document.getElementById('registerForm').reset();
            } catch (error) {
                alert("حدث خطأ أثناء الحفظ، أعد المحاولة: " + error.message);
            } finally {
                btn.disabled = false;
                btn.innerText = "إرسال طلب الانضمام";
            }
        }

        function handleLogin(e) {
            e.preventDefault();
            alert("ميزة تسجيل الدخول تحت الصيانة والتحديث.");
        }
    </script>
</body>
</html>
