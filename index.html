<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الكوتش | El-Coach Platform</title>
    <style>
        :root {
            --bg-dark: #050811;
            --primary: #3b82f6;
            --primary-glow: rgba(59, 130, 246, 0.4);
            --accent-cyan: #06b6d4;
            --glass-bg: rgba(15, 23, 42, 0.65);
            --glass-border: rgba(255, 255, 255, 0.12);
            --glass-input: rgba(2, 6, 23, 0.6);
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }

        * {
            box-sizing: border-box;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            padding: 24px 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow-x: hidden;
        }

        body::before, body::after {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            filter: blur(90px);
            z-index: -1;
            opacity: 0.5;
            animation: floatGlow 10s infinite alternate ease-in-out;
        }

        body::before {
            background: #2563eb;
            top: -50px;
            right: -50px;
        }

        body::after {
            background: #0891b2;
            bottom: -50px;
            left: -50px;
            animation-delay: -5s;
        }

        @keyframes floatGlow {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, 40px) scale(1.15); }
        }

        .main-card {
            width: 100%;
            max-width: 480px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 32px;
            padding: 32px 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 
                        inset 0 1px 1px rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            position: relative;
        }

        .logo-container {
            text-align: center;
            margin-bottom: 22px;
            position: relative;
        }

        .logo-img {
            width: 110px;
            height: 110px;
            object-fit: cover;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 25px var(--primary-glow);
            animation: pulseGlow 3s infinite ease-in-out;
        }

        @keyframes pulseGlow {
            0%, 100% {
                box-shadow: 0 0 20px var(--primary-glow), 0 0 40px rgba(6, 182, 212, 0.2);
                transform: scale(1);
            }
            50% {
                box-shadow: 0 0 35px var(--primary-glow), 0 0 70px rgba(6, 182, 212, 0.5);
                transform: scale(1.04);
            }
        }

        .app-title {
            text-align: center;
            font-size: 1.85rem;
            font-weight: 900;
            margin: 12px 0 6px 0;
            background: linear-gradient(135deg, #ffffff 0%, var(--accent-cyan) 50%, var(--primary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        .app-subtitle {
            text-align: center;
            color: var(--text-sub);
            font-size: 0.9rem;
            margin-bottom: 24px;
            line-height: 1.6;
        }

        .video-section {
            margin-bottom: 24px;
            border-radius: 24px;
            overflow: hidden;
            border: 1px solid var(--glass-border);
            background: #000;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
            position: relative;
        }

        .video-section video {
            width: 100%;
            display: block;
            border-radius: 24px;
            object-fit: cover;
        }

        .tab-buttons {
            display: flex;
            background: var(--glass-input);
            border: 1px solid var(--glass-border);
            border-radius: 18px;
            padding: 5px;
            margin-bottom: 24px;
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            border: none;
            background: transparent;
            color: var(--text-sub);
            font-weight: 700;
            font-size: 0.9rem;
            border-radius: 14px;
            cursor: pointer;
        }

        .tab-btn.active {
            background: linear-gradient(135deg, var(--primary), #2563eb);
            color: #ffffff;
            box-shadow: 0 4px 15px var(--primary-glow);
        }

        .form-group {
            margin-bottom: 18px;
            text-align: right;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--text-main);
            padding-right: 4px;
        }

        .form-control {
            width: 100%;
            padding: 14px 16px;
            border-radius: 16px;
            border: 1px solid var(--glass-border);
            background: var(--glass-input);
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
        }

        .form-control:focus {
            border-color: var(--primary);
            box-shadow: 0 0 15px var(--primary-glow);
            background: rgba(15, 23, 42, 0.85);
        }

        select.form-control option {
            background-color: #0f172a;
            color: #fff;
        }

        .whatsapp-notice {
            background: rgba(37, 211, 102, 0.1);
            border: 1px solid rgba(37, 211, 102, 0.3);
            border-radius: 16px;
            padding: 12px 14px;
            margin-bottom: 18px;
            font-size: 0.85rem;
            color: #25D366;
            text-align: center;
            line-height: 1.5;
        }

        .submit-btn {
            width: 100%;
            padding: 15px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: linear-gradient(135deg, #2563eb 0%, #06b6d4 100%);
            color: #ffffff;
            font-size: 1.05rem;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(37, 99, 235, 0.4);
            margin-top: 8px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(6, 182, 212, 0.5);
        }

        .support-title {
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-sub);
            margin: 28px 0 14px 0;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .social-buttons {
            display: flex;
            gap: 10px;
        }

        .social-btn {
            flex: 1;
            padding: 12px 8px;
            border-radius: 16px;
            text-decoration: none;
            text-align: center;
            font-size: 0.85rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            backdrop-filter: blur(8px);
            border: 1px solid var(--glass-border);
        }

        .social-btn.wa {
            background: rgba(37, 211, 102, 0.12);
            color: #25D366;
            border-color: rgba(37, 211, 102, 0.25);
        }

        .social-btn.tg {
            background: rgba(0, 136, 204, 0.12);
            color: #38bdf8;
            border-color: rgba(56, 189, 248, 0.25);
        }

        .social-btn.fb {
            background: rgba(24, 119, 242, 0.12);
            color: #60a5fa;
            border-color: rgba(96, 165, 250, 0.25);
        }

        .footer-credits {
            text-align: center;
            margin-top: 26px;
            font-size: 0.8rem;
            color: var(--text-sub);
            border-top: 1px solid var(--glass-border);
            padding-top: 16px;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="main-card">
        <div class="logo-container">
            <img src="1783950091830.jpg" alt="منصة الكوتش" class="logo-img" onerror="this.onerror=null; this.src='1783950091830';">
        </div>

        <h1 class="app-title">منصة الكوتش</h1>
        <p class="app-subtitle">
            🥇 <b>الداعم الأول والمساعد الأكاديمي والرياضي</b> لكل كباتن ورجال علوم الرياضة على مستوى الجمهورية.
        </p>

        <div class="video-section">
            <video autoplay muted loop playsinline poster="1783950091830.jpg">
                <source src="bebo123.mp4" type="video/mp4">
                <source src="bebo123" type="video/mp4">
            </video>
        </div>

        <div class="tab-buttons">
            <button class="tab-btn active" onclick="switchTab('register')">طلب انضمام جديد</button>
            <button class="tab-btn" onclick="switchTab('login')">تسجيل الدخول</button>
        </div>

        <!-- نموذج طلب الانضمام -->
        <form id="registerForm" onsubmit="handleRegister(event)">
            <div class="whatsapp-notice">
                ⚠️ <b>شرط أساسي لاكتمال التسجيل:</b> يجب الانضمام لقناة الواتساب الرسمية لمتابعة حالة قبول حسابك.
            </div>

            <div class="form-group">
                <label>الاسم الثلاثي / الخماسي</label>
                <input type="text" id="regName" class="form-control" placeholder="أدخل اسمك بالكامل" required>
            </div>
            <div class="form-group">
                <label>الفرقة الدراسية</label>
                <select id="regGrade" class="form-control" required>
                    <option value="">اختر الفرقة الدراسية</option>
                    <option value="الفرقة الأولى">الفرقة الأولى</option>
                    <option value="الفرقة الثانية">الفرقة الثانية</option>
                    <option value="الفرقة الثالثة">الفرقة الثالثة</option>
                    <option value="الفرقة الرابعة">الفرقة الرابعة</option>
                </select>
            </div>
            <div class="form-group">
                <label>رقم الهاتف (واتساب)</label>
                <input type="tel" id="regPhone" class="form-control" placeholder="01xxxxxxxxx" required>
            </div>
            <button type="submit" id="regSubmitBtn" class="submit-btn">إرسال طلب الانضمام والدخول للقناة</button>
        </form>

        <!-- نموذج تسجيل الدخول -->
        <form id="loginForm" onsubmit="handleLogin(event)" style="display: none;">
            <div class="form-group">
                <label>رقم الهاتف / اسم المستخدم</label>
                <input type="text" id="loginPhone" class="form-control" placeholder="01xxxxxxxxx أو admin" required>
            </div>
            <div class="form-group">
                <label>كود المرور / PIN</label>
                <input type="password" id="loginPin" class="form-control" placeholder="أدخل كود المرور" required>
            </div>
            <button type="submit" class="submit-btn">تسجيل الدخول</button>
        </form>

        <p class="support-title">أزرار الدعم والتواصل المباشر</p>
        
        <div class="social-buttons">
            <a href="https://wa.me/201098227150" id="waBtn" target="_blank" class="social-btn wa">واتساب</a>
            <a href="https://t.me/CapAbdo1" id="tgBtn" target="_blank" class="social-btn tg">تليجرام</a>
            <a href="https://www.facebook.com/cap.abdelnaseer.talat" id="fbBtn" target="_blank" class="social-btn fb">فيسبوك</a>
        </div>

        <div class="footer-credits">
            تطوير المهندس عبدالناصر © 2026
        </div>
    </div>

    <script>
        const FIREBASE_URL = "https://abodaa-default-rtdb.firebaseio.com";
        const BOT_TOKEN = "8944171880:AAFmbtL7TjB72ZtWKl4z_wjqlShSQFXkZpA"; 
        const CHAT_ID = "5926610601";
        const WA_CHANNEL_URL = "https://whatsapp.com/channel/0029VbDGX1rJpe8ZM6H5h02T";

        window.addEventListener('DOMContentLoaded', () => {
            checkRegistrationStatus();
            trackVisitor();
            loadSettings();
        });

        // زيادة عدد الزوار وتحديث المتواجدين حالياً في قاعدة البيانات للأدمن
        async function trackVisitor() {
            try {
                const res = await fetch(`${FIREBASE_URL}/stats.json`);
                let stats = await res.json() || { visitorsCount: 0, onlineNow: 1 };
                
                stats.visitorsCount = (stats.visitorsCount || 0) + 1;
                
                await fetch(`${FIREBASE_URL}/stats.json`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(stats)
                });
            } catch(e) {}
        }

        // جلب أزرار التواصل من إعدادات الأدمن
        async function loadSettings() {
            try {
                const res = await fetch(`${FIREBASE_URL}/settings.json`);
                const data = await res.json();
                if (data) {
                    if (data.whatsapp) document.getElementById('waBtn').href = `https://wa.me/${data.whatsapp}`;
                    if (data.telegram) document.getElementById('tgBtn').href = data.telegram;
                    if (data.facebook) document.getElementById('fbBtn').href = data.facebook;
                }
            } catch(e) {}
        }

        function checkRegistrationStatus() {
            const hasRegistered = localStorage.getItem('elcoach_registered');
            if (hasRegistered) {
                const regForm = document.getElementById('registerForm');
                regForm.innerHTML = `
                    <div style="text-align: center; padding: 20px 10px;">
                        <h3 style="color: #06b6d4; margin-bottom: 10px;">تم تسجيل طلبك بالفعل!</h3>
                        <p style="color: var(--text-sub); font-size: 0.9rem; line-height: 1.6;">
                            لقد قمت بإرسال طلب انضمام سابقاً لهذا الجهاز. يمكنك متابعة حالة القبول أو تسجيل الدخول فور التفعيل.
                        </p>
                        <a href="${WA_CHANNEL_URL}" target="_blank" class="submit-btn" style="display: block; text-decoration: none; margin-top: 15px;">
                            الانضمام لقناة الواتساب الرسمية
                        </a>
                    </div>
                `;
            }
        }

        function switchTab(tab) {
            const regForm = document.getElementById('registerForm');
            const loginForm = document.getElementById('loginForm');
            const buttons = document.querySelectorAll('.tab-btn');

            if (tab === 'register') {
                regForm.style.display = 'block';
                loginForm.style.display = 'none';
                buttons[0].classList.add('active');
                buttons[1].classList.remove('active');
            } else {
                regForm.style.display = 'none';
                loginForm.style.display = 'block';
                buttons[0].classList.remove('active');
                buttons[1].classList.add('active');
            }
        }

        async function handleRegister(e) {
            e.preventDefault();

            if (localStorage.getItem('elcoach_registered')) {
                alert("تم تسجيل طلبك مسبقاً من هذا الجهاز!");
                return;
            }
            
            const name = document.getElementById('regName').value.trim();
            const grade = document.getElementById('regGrade').value;
            const phone = document.getElementById('regPhone').value.trim();

            try {
                const checkRes = await fetch(`${FIREBASE_URL}/students.json`);
                const existingData = await checkRes.json();

                if (existingData) {
                    const isPhoneDuplicate = Object.values(existingData).some(student => student.phone === phone);
                    if (isPhoneDuplicate) {
                        alert("رقم الهاتف هذا مسجل بالفعل في المنصة!");
                        return;
                    }
                }

                const studentData = {
                    name: name,
                    grade: grade,
                    phone: phone,
                    status: 'pending',
                    createdAt: new Date().toISOString()
                };

                const res = await fetch(`${FIREBASE_URL}/students.json`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(studentData)
                });

                if (!res.ok) throw new Error("تعذر حفظ الطلب");

                let formattedPhone = phone.startsWith('0') ? '2' + phone : phone;
                const textMessage = `🔔 <b>طلب تسجيل جديد في منصة الكوتش</b>\n\n👤 <b>الاسم:</b> ${name}\n📚 <b>الفرقة:</b> ${grade}\n📱 <b>الهاتف:</b> ${phone}`;

                const payload = {
                    chat_id: CHAT_ID,
                    text: textMessage,
                    parse_mode: 'HTML',
                    reply_markup: {
                        inline_keyboard: [
                            [
                                { text: "📲 فتح واتساب الطالب مباشرة", url: `https://wa.me/${formattedPhone}` },
                                { text: "⚙️ فتح لوحة التحكم", url: `https://cap-abdelnaseer-talat.github.io/DrAli1/admin.html` }
                            ]
                        ]
                    }
                };

                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                localStorage.setItem('elcoach_registered', 'true');
                localStorage.setItem('elcoach_user_phone', phone);

                alert("تم إرسال طلبك بنجاح! سيتم تحويلك الآن لقناة الواتساب الرسمية.");
                window.location.href = WA_CHANNEL_URL;

            } catch (err) {
                console.error(err);
                alert("حدث خطأ أثناء الاتصال بالخادم.");
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const phone = document.getElementById('loginPhone').value.trim();
            const pin = document.getElementById('loginPin').value.trim();

            // دخول مسؤول المنصة بحماية التوجيه الخارجي
            if ((phone === 'admin' || phone === '01000000000') && pin === 'admin2026') {
                window.location.href = "admin.html";
                return;
            }

            try {
                const res = await fetch(`${FIREBASE_URL}/students.json`);
                const data = await res.json();

                let foundUser = null;
                if (data) {
                    Object.keys(data).forEach(key => {
                        const student = data[key];
                        if (student.phone === phone && String(student.pin) === String(pin) && student.status === 'approved') {
                            foundUser = { id: key, ...student };
                        }
                    });
                }

                if (foundUser) {
                    localStorage.setItem('currentUser', JSON.stringify(foundUser));
                    window.location.href = "courses.html";
                } else {
                    alert("رقم الهاتف أو كود المرور غير صحيح، أو لم يتم تفعيل حسابك بعد من اللوحة.");
                }
            } catch (err) {
                console.error(err);
                alert("حدث خطأ أثناء الاتصال بقاعدة البيانات.");
            }
        }
    </script>
</body>
</html>
