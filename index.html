<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الكوتش | El-Coach Platform</title>

    <!-- خط تجوال العربي الفخم -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-dark: #030712;
            --primary-blue: #3b82f6;
            --cyan-glow: #06b6d4;
            --accent-gold: #f59e0b;
            --glass-bg: rgba(15, 23, 42, 0.75);
            --glass-border: rgba(255, 255, 255, 0.12);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; font-family: 'Tajawal', sans-serif; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 12px;
            position: relative;
            overflow-x: hidden;
        }

        body::before, body::after {
            content: ''; position: fixed; width: 320px; height: 320px;
            border-radius: 50%; filter: blur(90px); z-index: 0;
            animation: pulseGlow 8s infinite alternate ease-in-out;
        }
        body::before { background: rgba(59, 130, 246, 0.35); top: -50px; right: -50px; }
        body::after { background: rgba(6, 182, 212, 0.25); bottom: -50px; left: -50px; animation-delay: 4s; }

        @keyframes pulseGlow {
            0% { transform: scale(1) translate(0, 0); opacity: 0.6; }
            100% { transform: scale(1.3) translate(20px, 30px); opacity: 0.9; }
        }

        .glass-card {
            position: relative; z-index: 10; width: 100%; max-width: 460px;
            background: var(--glass-bg); backdrop-filter: blur(25px) saturate(180%);
            -webkit-backdrop-filter: blur(25px) saturate(180%);
            border: 1px solid var(--glass-border); border-radius: 28px; padding: 28px 22px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8), 0 0 35px rgba(59, 130, 246, 0.25);
        }

        .profile-wrapper { text-align: center; margin-bottom: 16px; }
        .profile-img-container {
            width: 110px; height: 110px; margin: 0 auto; border-radius: 50%; padding: 4px;
            background: linear-gradient(135deg, var(--primary-blue), var(--cyan-glow), var(--accent-gold));
            box-shadow: 0 0 25px rgba(59, 130, 246, 0.6); animation: ringRotate 6s linear infinite;
        }

        @keyframes ringRotate { 0% { filter: hue-rotate(0deg); } 100% { filter: hue-rotate(360deg); } }

        .profile-img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; border: 2px solid var(--bg-dark); }

        .app-title {
            text-align: center; font-size: 1.9rem; font-weight: 900; margin: 8px 0 4px 0;
            background: linear-gradient(135deg, #ffffff 30%, var(--primary-blue), var(--cyan-glow));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        .app-subtitle { text-align: center; color: var(--text-muted); font-size: 0.88rem; margin-bottom: 20px; line-height: 1.6; }

        /* حاوية الفيديو مع دعم يوتيوب والملفات المحلية */
        .video-container {
            width: 100%; border-radius: 20px; overflow: hidden;
            border: 1px solid rgba(59, 130, 246, 0.4); box-shadow: 0 0 20px rgba(59, 130, 246, 0.3);
            margin-bottom: 20px; background: #000; position: relative; padding-bottom: 56.25%; height: 0;
        }
        .video-container iframe, .video-container video {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; object-fit: cover;
        }

        .tab-wrapper {
            display: flex; background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--glass-border); border-radius: 16px; padding: 5px; margin-bottom: 20px;
        }

        .tab-btn {
            flex: 1; padding: 12px; border: none; background: transparent;
            color: var(--text-muted); font-weight: 700; font-size: 0.9rem;
            border-radius: 12px; cursor: pointer; transition: all 0.3s ease;
        }

        .tab-btn.active { background: linear-gradient(135deg, var(--primary-blue), #1d4ed8); color: #ffffff; box-shadow: 0 0 20px rgba(59, 130, 246, 0.6); }

        .form-group { margin-bottom: 16px; text-align: right; }
        .form-group label { display: block; font-size: 0.85rem; font-weight: 700; margin-bottom: 6px; }

        .form-control {
            width: 100%; padding: 12px 14px; border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.1); background: rgba(15, 23, 42, 0.7);
            color: var(--text-main); font-size: 0.95rem; outline: none;
        }

        .submit-btn {
            width: 100%; padding: 14px; border-radius: 14px; border: none;
            background: linear-gradient(135deg, var(--primary-blue), var(--cyan-glow));
            color: #ffffff; font-size: 1rem; font-weight: 800; cursor: pointer;
            box-shadow: 0 0 25px rgba(59, 130, 246, 0.5); transition: all 0.3s ease; margin-top: 6px;
        }

        /* لوحة الأدمن المصممة */
        .admin-panel { display: none; background: rgba(15, 23, 42, 0.9); border-radius: 16px; padding: 16px; border: 1px solid var(--cyan-glow); margin-top: 15px; }
        .admin-panel h3 { color: var(--cyan-glow); font-size: 1.1rem; margin-bottom: 12px; text-align: center; }
        .student-item {
            background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px; padding: 10px; margin-bottom: 10px; display: flex;
            justify-content: space-between; align-items: center; font-size: 0.85rem;
        }
        .del-btn { background: #ef4444; color: #fff; border: none; padding: 5px 10px; border-radius: 8px; cursor: pointer; font-weight: bold; }

        .social-grid { display: flex; gap: 10px; margin-top: 20px; }
        .social-card {
            flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px;
            padding: 10px 4px; border-radius: 14px; text-decoration: none; font-weight: 800; font-size: 0.82rem;
            border: 1px solid rgba(255, 255, 255, 0.08); background: rgba(255, 255, 255, 0.03);
        }
        .social-card.wa { color: #25D366; } .social-card.tg { color: #0088cc; } .social-card.fb { color: #1877F2; }
        .social-card svg { width: 18px; height: 18px; fill: currentColor; }

        .footer-credits { text-align: center; margin-top: 20px; font-size: 0.8rem; color: var(--text-muted); border-top: 1px solid rgba(255, 255, 255, 0.08); padding-top: 14px; }
    </style>
</head>
<body>

    <div class="glass-card">
        <div class="profile-wrapper">
            <div class="profile-img-container">
                <img src="1783950091830.jpg" onerror="this.onerror=null; this.src='1783950091830.png'; this.onerror=function(){this.src='1783950091830';}" alt="الكوتش عبدالناصر" class="profile-img">
            </div>
        </div>

        <h1 class="app-title">منصة الكوتش</h1>
        <p class="app-subtitle">🥇 الداعم الأول والمساعد الأكاديمي والرياضي لكل كباتن ورجال علوم الرياضة على مستوى الجمهورية.</p>

        <!-- مشغل فيديو يوتيوب المدمج المباشر -->
        <div class="video-container">
            <!-- غيّر لينك فيديو اليوتيوب هنا برابط قناتك أو أي فيديو آخر -->
            <iframe src="https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=0&controls=1" allowfullscreen></iframe>
        </div>

        <div class="tab-wrapper" id="tabWrapper">
            <button class="tab-btn active" onclick="switchTab('register')">طلب انضمام جديد</button>
            <button class="tab-btn" onclick="switchTab('login')">تسجيل الدخول</button>
        </div>

        <!-- نموذج الانضمام -->
        <form id="registerForm" onsubmit="handleRegister(event)">
            <div class="form-group">
                <label>الاسم الثلاثي / الخماسي</label>
                <input type="text" id="regName" class="form-control" placeholder="أدخل اسمك بالكامل" required>
            </div>
            <div class="form-group">
                <label>الفرقة الدراسية</label>
                <select id="regGrade" class="form-control" required>
                    <option value="">اختر الفرقة الدراسية</option>
                    <option value="الفرقة الأولى">الفرقة الأولى</option>
                    <option value="الفرقة الثانية">الفرقة الثانية</option>
                    <option value="الفرقة الثالثة">الفرقة الثالثة</option>
                    <option value="الفرقة الرابعة">الفرقة الرابعة</option>
                </select>
            </div>
            <div class="form-group">
                <label>رقم الهاتف (واتساب)</label>
                <input type="tel" id="regPhone" class="form-control" placeholder="01xxxxxxxxx" required>
            </div>
            <button type="submit" id="btnReg" class="submit-btn">إرسال طلب الانضمام 🚀</button>
        </form>

        <!-- نموذج تسجيل الدخول -->
        <form id="loginForm" onsubmit="handleLogin(event)" style="display: none;">
            <div class="form-group">
                <label>اسم المستخدم / الأدمن</label>
                <input type="text" id="loginPhone" class="form-control" placeholder="admin" required>
            </div>
            <div class="form-group">
                <label>كود المرور / PIN</label>
                <input type="password" id="loginPin" class="form-control" placeholder="1234" required>
            </div>
            <button type="submit" class="submit-btn">تسجيل الدخول 🔓</button>
        </form>

        <!-- لوحة تحكم الأدمن للطلبات المسجلة -->
        <div id="adminPanel" class="admin-panel">
            <h3>لوحة تحكم الكوتش (الطلبات المسجلة)</h3>
            <div id="studentsList">جاري التحميل...</div>
            <button onclick="logoutAdmin()" class="submit-btn" style="background:#ef4444; margin-top:12px;">تسجيل الخروج</button>
        </div>

        <div class="social-grid">
            <a href="https://wa.me/201098227150" target="_blank" class="social-card wa"><svg viewBox="0 0 24 24"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/></svg>واتساب</a>
            <a href="https://t.me/CapAbdo1" target="_blank" class="social-card tg"><svg viewBox="0 0 24 24"><path d="M12 0c-6.627 0-12 5.373-12 12s5.373 12 12 12 12-5.373 12-12-5.373-12-12-12zm5.894 8.221l-1.97 9.28c-.145.658-.537.818-1.084.508l-3-2.21-1.446 1.394c-.16.16-.295.295-.605.295l.213-3.053 5.56-5.023c.242-.213-.054-.333-.373-.121l-6.871 4.326-2.962-.924c-.643-.204-.657-.643.136-.953l11.57-4.458c.538-.196 1.006.128.832.941z"/></svg>تليجرام</a>
            <a href="https://www.facebook.com/cap.abdelnaseer.talat" target="_blank" class="social-card fb"><svg viewBox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>فيسبوك</a>
        </div>

        <div class="footer-credits">تطوير المهندس عبدالناصر © 2026</div>
    </div>

    <script>
        function switchTab(tab) {
            document.getElementById('registerForm').style.display = (tab === 'register') ? 'block' : 'none';
            document.getElementById('loginForm').style.display = (tab === 'login') ? 'block' : 'none';
            document.getElementById('adminPanel').style.display = 'none';
            const btns = document.querySelectorAll('.tab-btn');
            btns[0].classList.toggle('active', tab === 'register');
            btns[1].classList.toggle('active', tab === 'login');
        }

        // تسجيل الطلبات محلياً بدون سيرفر
        function handleRegister(e) {
            e.preventDefault();
            const name = document.getElementById('regName').value.trim();
            const grade = document.getElementById('regGrade').value;
            const phone = document.getElementById('regPhone').value.trim();

            const newStudent = { id: Date.now(), name, grade, phone };

            // حفظ في ذاكرة المتصفح المحلية
            let students = JSON.parse(localStorage.getItem('coach_students') || '[]');
            students.push(newStudent);
            localStorage.setItem('coach_students', JSON.stringify(students));

            alert("✅ تم إرسال طلبك بنجاح وسيتواصل معك الكوتش قريبًا!");
            document.getElementById('registerForm').reset();
        }

        // تسجيل دخول الأدمن
        function handleLogin(e) {
            e.preventDefault();
            const user = document.getElementById('loginPhone').value.trim();
            const pin = document.getElementById('loginPin').value.trim();

            if (user === "admin" && pin === "1234") {
                document.getElementById('registerForm').style.display = 'none';
                document.getElementById('loginForm').style.display = 'none';
                document.getElementById('tabWrapper').style.display = 'none';
                document.getElementById('adminPanel').style.display = 'block';
                loadStudentsForAdmin();
            } else {
                alert("بيانات الدخول غير صحيحة! الأدمن: admin والرمز: 1234");
            }
        }

        // عرض الطلاب في لوحة الأدمن
        function loadStudentsForAdmin() {
            const listDiv = document.getElementById('studentsList');
            let students = JSON.parse(localStorage.getItem('coach_students') || '[]');
            
            if (students.length === 0) {
                listDiv.innerHTML = "<p style='text-align:center; color:var(--text-muted);'>لا توجد طلبات مسجلة حالياً.</p>";
                return;
            }

            let html = "";
            students.forEach((item, index) => {
                html += `
                    <div class="student-item">
                        <div>
                            <strong>${item.name}</strong> (${item.grade})<br>
                            <small style="color:var(--cyan-glow);">${item.phone}</small>
                        </div>
                        <button class="del-btn" onclick="deleteStudent(${index})">حذف</button>
                    </div>
                `;
            });
            listDiv.innerHTML = html;
        }

        // حذف طالب من القائمة
        function deleteStudent(index) {
            if(confirm("هل أنت متأكد من حذف هذا الطالب؟")) {
                let students = JSON.parse(localStorage.getItem('coach_students') || '[]');
                students.splice(index, 1);
                localStorage.setItem('coach_students', JSON.stringify(students));
                loadStudentsForAdmin();
            }
        }

        function logoutAdmin() {
            document.getElementById('tabWrapper').style.display = 'flex';
            switchTab('register');
        }
    </script>
</body>
</html>
