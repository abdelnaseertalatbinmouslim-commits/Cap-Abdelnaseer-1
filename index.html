<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الكوتش | El-Coach Platform</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(255, 255, 255, 0.05);
            --border-color: rgba(255, 255, 255, 0.1);
            --accent-color: #00e5ff;
            --text-color: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header h1 {
            font-size: 24px;
            color: var(--accent-color);
            margin-bottom: 5px;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .tab-btn.active {
            background: var(--accent-color);
            color: #000;
            font-weight: bold;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            background: rgba(0, 0, 0, 0.3);
            color: #fff;
            outline: none;
        }

        select option {
            background: #0b0f19;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background: var(--accent-color);
            color: #000;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        .footer {
            margin-top: 20px;
            text-align: center;
            font-size: 12px;
            opacity: 0.7;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>منصة الكوتش</h1>
        <p>بوابتك للتفوق الأكاديمي والرياضي</p>
    </div>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('register')">طلب انضمام</button>
        <button class="tab-btn" onclick="switchTab('login')">تسجيل دخول</button>
    </div>

    <form id="registerForm" onsubmit="handleRegister(event)">
        <div class="form-group">
            <label>الاسم بالكامل</label>
            <input type="text" id="regName" required placeholder="أدخل اسمك الثلاثي">
        </div>
        <div class="form-group">
            <label>الفرقة الدراسية</label>
            <select id="regGrade" required>
                <option value="الفرقة الأولى">الفرقة الأولى</option>
                <option value="الفرقة الثانية">الفرقة الثانية</option>
                <option value="الفرقة الثالثة">الفرقة الثالثة</option>
                <option value="الفرقة الرابعة">الفرقة الرابعة</option>
                <option value="خريج / كابتن">خريج / كابتن</option>
            </select>
        </div>
        <div class="form-group">
            <label>رقم الهاتف (واتساب)</label>
            <input type="tel" id="regPhone" required placeholder="01xxxxxxxx">
        </div>
        <button type="submit" class="submit-btn">إرسال طلب الانضمام</button>
    </form>

    <form id="loginForm" onsubmit="handleLogin(event)" style="display: none;">
        <div class="form-group">
            <label>رقم الهاتف</label>
            <input type="text" id="loginPhone" required placeholder="أدخل رقم هاتفك">
        </div>
        <div class="form-group">
            <label>كود المرور (PIN)</label>
            <input type="password" id="loginPin" required placeholder="أدخل كود المرور الخاص بك">
        </div>
        <button type="submit" class="submit-btn">تسجيل الدخول</button>
    </form>

    <div class="footer">
        تطوير وإعداد: المهندس عبدالناصر ✍️
    </div>
</div>

<script>
    // إعدادات Supabase
    const SUPABASE_URL = "https://qvkpeoqbmoqczfjjexfs.supabase.com";
    const SUPABASE_KEY = "sb_publishable_VpMTCDC7K8W4DcOc1-Y48w_ykbjl94q";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // تبديل التبويبات
    function switchTab(tab) {
        const regForm = document.getElementById('registerForm');
        const loginForm = document.getElementById('loginForm');
        const buttons = document.querySelectorAll('.tab-btn');

        if (tab === 'register') {
            regForm.style.display = 'block';
            loginForm.style.display = 'none';
            buttons[0].classList.add('active');
            buttons[1].classList.remove('active');
        } else {
            regForm.style.display = 'none';
            loginForm.style.display = 'block';
            buttons[0].classList.remove('active');
            buttons[1].classList.add('active');
        }
    }

    // معالجة طلب الانضمام
    async function handleRegister(e) {
        e.preventDefault();
        
        const name = document.getElementById('regName').value.trim();
        const grade = document.getElementById('regGrade').value;
        const phone = document.getElementById('regPhone').value.trim();

        // 1. حفظ البيانات فوراً في سحابة Supabase
        const { data, error } = await supabaseClient
            .from('students')
            .insert([
                { name: name, grade: grade, phone: phone, status: 'pending' }
            ]);

        if (error) {
            console.error("خطأ في Supabase:", error);
            alert("حدث خطأ أثناء حفظ الطلب! تأكد من إنشاء جدول students بشكل صحيح.");
            return;
        }

        // 2. إرسال إشعار البوت في التليجرام
        const BOT_TOKEN = "8944171880:AAFmbtL7TjB72ZtWKl4z_wjqlShSQFXkZpA"; 
        const CHAT_ID = "5926610601";
        let formattedPhone = phone.startsWith('0') ? '2' + phone : phone;

        const textMessage = `🔔 <b>طلب تسجيل جديد في منصة الكوتش</b>\n\n👤 <b>الاسم:</b> ${name}\n📚 <b>الفرقة:</b> ${grade}\n📱 <b>الهاتف:</b> ${phone}`;

        const payload = {
            chat_id: CHAT_ID,
            text: textMessage,
            parse_mode: 'HTML',
            reply_markup: {
                inline_keyboard: [
                    [
                        { text: "📲 فتح واتساب الطالب", url: `https://wa.me/${formattedPhone}` },
                        { text: "⚙️ لوحة التحكم", url: `https://cap-abdelnaseer-talat.github.io/DrAli1/admin.html` }
                    ]
                ]
            }
        };

        try {
            await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
        } catch (err) {
            console.log("تعذر وصول التليجرام، لكن البيانات مُسجلة في السحابة بنجاح!");
        }

        alert("تم إرسال طلبك بنجاح لـ منصة الكوتش!");
        e.target.reset();
    }

    // معالجة تسجيل الدخول
    async function handleLogin(e) {
        e.preventDefault();
        const phone = document.getElementById('loginPhone').value.trim();
        const pin = document.getElementById('loginPin').value.trim();

        // دخول الأدمن
        if ((phone === 'admin' || phone === '01000000000') && pin === 'admin2026') {
            window.location.href = "admin.html";
            return;
        }

        // دخول الطلاب من قاعدة البيانات السحابية
        const { data: user, error } = await supabaseClient
            .from('students')
            .select('*')
            .eq('phone', phone)
            .eq('pin', pin)
            .eq('status', 'approved')
            .single();

        if (user) {
            localStorage.setItem('currentUser', JSON.stringify(user));
            window.location.href = "courses.html";
        } else {
            alert("رقم الهاتف أو كود المرور غير صحيح، أو لم يتم قبول حسابك بعد.");
        }
    }
</script>
</body>
</html>
