<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الكوتش | El-Coach Platform</title>

    <!-- مكتبات Firebase السحابية -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <!-- خط تجوال العربي الفخم -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-dark: #030712;
            --primary-blue: #3b82f6;
            --cyan-glow: #06b6d4;
            --accent-gold: #f59e0b;
            --glass-bg: rgba(15, 23, 42, 0.65);
            --glass-border: rgba(255, 255, 255, 0.12);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            font-family: 'Tajawal', sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 12px;
            position: relative;
            overflow-x: hidden;
        }

        /* خلفية زجاجية متحركة وبتنور (Glowing Ambient Background) */
        body::before, body::after {
            content: '';
            position: fixed;
            width: 320px;
            height: 320px;
            border-radius: 50%;
            filter: blur(90px);
            z-index: 0;
            animation: pulseGlow 8s infinite alternate ease-in-out;
        }
        body::before {
            background: rgba(59, 130, 246, 0.35);
            top: -50px;
            right: -50px;
        }
        body::after {
            background: rgba(6, 182, 212, 0.25);
            bottom: -50px;
            left: -50px;
            animation-delay: 4s;
        }

        @keyframes pulseGlow {
            0% { transform: scale(1) translate(0, 0); opacity: 0.6; }
            100% { transform: scale(1.3) translate(20px, 30px); opacity: 0.9; }
        }

        /* الكارت الزجاجي الرئيسي (Glassmorphic Card) */
        .glass-card {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 440px;
            background: var(--glass-bg);
            backdrop-filter: blur(25px) saturate(180%);
            -webkit-backdrop-filter: blur(25px) saturate(180%);
            border: 1px solid var(--glass-border);
            border-radius: 28px;
            padding: 28px 22px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8),
                        0 0 35px rgba(59, 130, 246, 0.25);
            transition: all 0.4s ease;
        }

        /* الصورة الشخصية العلوية بإطار نيون مضيء */
        .profile-wrapper {
            text-align: center;
            margin-bottom: 16px;
            position: relative;
        }

        .profile-img-container {
            width: 120px;
            height: 120px;
            margin: 0 auto;
            border-radius: 50%;
            padding: 4px;
            background: linear-gradient(135deg, var(--primary-blue), var(--cyan-glow), var(--accent-gold));
            box-shadow: 0 0 25px rgba(59, 130, 246, 0.6), inset 0 0 15px rgba(6, 182, 212, 0.5);
            animation: ringRotate 6s linear infinite;
        }

        @keyframes ringRotate {
            0% { filter: hue-rotate(0deg); }
            100% { filter: hue-rotate(360deg); }
        }

        .profile-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            border: 2px solid var(--bg-dark);
            display: block;
        }

        /* العناوين والطباعة */
        .app-title {
            text-align: center;
            font-size: 2rem;
            font-weight: 900;
            margin: 8px 0 4px 0;
            background: linear-gradient(135deg, #ffffff 30%, var(--primary-blue), var(--cyan-glow));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(59, 130, 246, 0.3);
        }

        .app-subtitle {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.88rem;
            font-weight: 500;
            margin-bottom: 22px;
            line-height: 1.6;
            padding: 0 8px;
        }

        /* مشغل الفيديو المزود بهالة ضوئية */
        .video-container {
            width: 100%;
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid rgba(59, 130, 246, 0.4);
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.3), inset 0 0 10px rgba(0,0,0,0.8);
            margin-bottom: 22px;
            background: #000;
            position: relative;
        }

        .video-container video {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 20px;
            object-fit: cover;
        }

        /* أزرار التبديل الزجاجية (Tabs) */
        .tab-wrapper {
            display: flex;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 5px;
            margin-bottom: 22px;
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            border: none;
            background: transparent;
            color: var(--text-muted);
            font-weight: 700;
            font-size: 0.92rem;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .tab-btn.active {
            background: linear-gradient(135deg, var(--primary-blue), #1d4ed8);
            color: #ffffff;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.6);
        }

        /* حقول الإدخال الزجاجية (Glass Inputs) */
        .form-group {
            margin-bottom: 18px;
            text-align: right;
        }

        .form-group label {
            display: block;
            font-size: 0.86rem;
            font-weight: 700;
            margin-bottom: 8px;
            color: #e2e8f0;
        }

        .form-control {
            width: 100%;
            padding: 13px 16px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(15, 23, 42, 0.7);
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            border-color: var(--primary-blue);
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.4);
            background: rgba(15, 23, 42, 0.9);
        }

        /* زر الإرسال المتوهج (Glowing Action Button) */
        .submit-btn {
            width: 100%;
            padding: 14px;
            border-radius: 14px;
            border: none;
            background: linear-gradient(135deg, var(--primary-blue), var(--cyan-glow));
            color: #ffffff;
            font-size: 1.05rem;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(59, 130, 246, 0.5);
            transition: all 0.3s ease;
            margin-top: 6px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 35px rgba(6, 182, 212, 0.7);
        }

        /* قسم الدعم والتواصل الأنيق مع أيقونات الأبلكيشنز */
        .support-title {
            text-align: center;
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-muted);
            margin: 24px 0 14px 0;
            position: relative;
        }

        .support-title::before, .support-title::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 25%;
            height: 1px;
            background: rgba(255, 255, 255, 0.1);
        }
        .support-title::before { right: 0; }
        .support-title::after { left: 0; }

        .social-grid {
            display: flex;
            gap: 12px;
        }

        .social-card {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 8px;
            border-radius: 16px;
            text-decoration: none;
            font-weight: 800;
            font-size: 0.85rem;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        /* ألوان النيون الرسمية للتطبيقات */
        .social-card.wa {
            color: #25D366;
            border-color: rgba(37, 211, 102, 0.3);
        }
        .social-card.wa:hover {
            background: rgba(37, 211, 102, 0.15);
            box-shadow: 0 0 20px rgba(37, 211, 102, 0.4);
            transform: translateY(-2px);
        }

        .social-card.tg {
            color: #0088cc;
            border-color: rgba(0, 136, 204, 0.3);
        }
        .social-card.tg:hover {
            background: rgba(0, 136, 204, 0.15);
            box-shadow: 0 0 20px rgba(0, 136, 204, 0.4);
            transform: translateY(-2px);
        }

        .social-card.fb {
            color: #1877F2;
            border-color: rgba(24, 119, 242, 0.3);
        }
        .social-card.fb:hover {
            background: rgba(24, 119, 242, 0.15);
            box-shadow: 0 0 20px rgba(24, 119, 242, 0.4);
            transform: translateY(-2px);
        }

        .social-card svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        /* الحقوق والتوقيع */
        .footer-credits {
            text-align: center;
            margin-top: 24px;
            font-size: 0.82rem;
            color: var(--text-muted);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding-top: 16px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <div class="glass-card">
        <!-- الصورة الشخصية العلوية بملف الصورة المرفوع 1783950091830 -->
        <div class="profile-wrapper">
            <div class="profile-img-container">
                <img src="1783950091830.jpg" onerror="this.onerror=null; this.src='1783950091830.png'; this.onerror=function(){this.src='1783950091830';}" alt="الكوتش عبدالناصر" class="profile-img">
            </div>
        </div>

        <h1 class="app-title">منصة الكوتش</h1>
        <p class="app-subtitle">🥇 الداعم الأول والمساعد الأكاديمي والرياضي لكل كباتن ورجال علوم الرياضة على مستوى الجمهورية.</p>

        <!-- الفيديو المرفوع (bebo123) -->
        <div class="video-container">
            <video autoplay muted loop playsinline id="heroVideo">
                <source src="bebo123.mp4" type="video/mp4">
                <source src="bebo123" type="video/mp4">
                متصفحك لا يدعم تشغيل الفيديو.
            </video>
        </div>

        <!-- أزرار التبديل -->
        <div class="tab-wrapper">
            <button class="tab-btn active" onclick="switchTab('register')">طلب انضمام جديد</button>
            <button class="tab-btn" onclick="switchTab('login')">تسجيل الدخول</button>
        </div>

        <!-- نموذج طلب الانضمام -->
        <form id="registerForm" onsubmit="handleRegister(event)">
            <div class="form-group">
                <label>الاسم الثلاثي / الخماسي</label>
                <input type="text" id="regName" class="form-control" placeholder="أدخل اسمك بالكامل" required>
            </div>
            <div class="form-group">
                <label>الفرقة الدراسية</label>
                <select id="regGrade" class="form-control" required>
                    <option value="">اختر الفرقة الدراسية</option>
                    <option value="الفرقة الأولى">الفرقة الأولى</option>
                    <option value="الفرقة الثانية">الفرقة الثانية</option>
                    <option value="الفرقة الثالثة">الفرقة الثالثة</option>
                    <option value="الفرقة الرابعة">الفرقة الرابعة</option>
                </select>
            </div>
            <div class="form-group">
                <label>رقم الهاتف (واتساب)</label>
                <input type="tel" id="regPhone" class="form-control" placeholder="01xxxxxxxxx" required>
            </div>
            <button type="submit" id="btnReg" class="submit-btn">إرسال طلب الانضمام 🚀</button>
        </form>

        <!-- نموذج تسجيل الدخول -->
        <form id="loginForm" onsubmit="handleLogin(event)" style="display: none;">
            <div class="form-group">
                <label>رقم الهاتف / اسم المستخدم</label>
                <input type="text" id="loginPhone" class="form-control" placeholder="01xxxxxxxxx أو admin" required>
            </div>
            <div class="form-group">
                <label>كود المرور / PIN</label>
                <input type="password" id="loginPin" class="form-control" placeholder="أدخل كود المرور" required>
            </div>
            <button type="submit" class="submit-btn">تسجيل الدخول 🔓</button>
        </form>

        <!-- أزرار الدعم مع أشكال التطبيقات المضيئة -->
        <div class="support-title">الدعم والتواصل المباشر</div>
        <div class="social-grid">
            <!-- WhatsApp -->
            <a href="https://wa.me/201098227150" target="_blank" class="social-card wa">

                واتساب
            </a>
            <!-- Telegram -->
            <a href="https://t.me/CapAbdo1" target="_blank" class="social-card tg">
                <svg viewBox="0 0 24 24"><path d="M12 0c-6.627 0-12 5.373-12 12s5.373 12 12 12 12-5.373 12-12-5.373-12-12-12zm5.894 8.221l-1.97 9.28c-.145.658-.537.818-1.084.508l-3-2.21-1.446 1.394c-.16.16-.295.295-.605.295l.213-3.053 5.56-5.023c.242-.213-.054-.333-.373-.121l-6.871 4.326-2.962-.924c-.643-.204-.657-.643.136-.953l11.57-4.458c.538-.196 1.006.128.832.941z"/></svg>
                تليجرام
            </a>
            <!-- Facebook -->
            <a href="https://www.facebook.com/cap.abdelnaseer.talat" target="_blank" class="social-card fb">

                فيسبوك
            </a>
        </div>

        <div class="footer-credits">تطوير المهندس عبدالناصر © 2026</div>
    </div>

    <script>
        // بيانات مشروع Firebase الحقيقية الخاصة بك
        const firebaseConfig = {
            apiKey: "AIzaSyAtRET95Dlp58sEPKm3g_nJ_90AQFme_P0",
            authDomain: "elcoach-a06cd.firebaseapp.com",
            databaseURL: "https://elcoach-a06cd-default-rtdb.firebaseio.com",
            projectId: "elcoach-a06cd",
            storageBucket: "elcoach-a06cd.firebasestorage.app",
            messagingSenderId: "1005781255562",
            appId: "1:1005781255562:web:8cfa840d88739de42cf473",
            measurementId: "G-4EC0Q65RK8"
        };

        // تهيئة Firebase
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        function switchTab(tab) {
            document.getElementById('registerForm').style.display = (tab === 'register') ? 'block' : 'none';
            document.getElementById('loginForm').style.display = (tab === 'login') ? 'block' : 'none';
            const btns = document.querySelectorAll('.tab-btn');
            btns[0].classList.toggle('active', tab === 'register');
            btns[1].classList.toggle('active', tab === 'login');
        }

        async function handleRegister(e) {
            e.preventDefault();
            const btn = document.getElementById('btnReg');
            btn.disabled = true;
            btn.innerText = "جاري الحفظ في السيرفر...";

            const name = document.getElementById('regName').value.trim();
            const grade = document.getElementById('regGrade').value;
            const phone = document.getElementById('regPhone').value.trim();

            try {
                const newReqRef = db.ref('pendingRequests').push();
                await newReqRef.set({
                    id: newReqRef.key,
                    name: name,
                    grade: grade,
                    phone: phone,
                    timestamp: Date.now()
                });

                alert("تم إرسال طلبك بنجاح وسيتواصل معك الكوتش قريبًا!");
                document.getElementById('registerForm').reset();
            } catch (error) {
                alert("حدث خطأ أثناء الحفظ، أعد المحاولة: " + error.message);
            } finally {
                btn.disabled = false;
                btn.innerText = "إرسال طلب الانضمام 🚀";
            }
        }

        function handleLogin(e) {
            e.preventDefault();
            alert("ميزة تسجيل الدخول تحت الصيانة والتحديث.");
        }
    </script>
</body>
</html>
