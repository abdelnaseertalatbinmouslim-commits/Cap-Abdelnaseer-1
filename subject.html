<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفاصيل المادة الدراسية | منصة الكابتن</title>
    <style>
        :root {
            --bg-color: #f0f4f8;
            --card-bg: rgba(255, 255, 255, 0.95);
            --text-color: #0f172a;
            --text-muted: #475569;
            --primary: #2563eb;
            --primary-glow: #3b82f6;
            --border-color: #cbd5e1;
            --input-bg: #ffffff;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #0b0f19;
                --card-bg: rgba(18, 24, 38, 0.95);
                --text-color: #f8fafc;
                --text-muted: #94a3b8;
                --primary: #3b82f6;
                --primary-glow: #60a5fa;
                --border-color: #1e293b;
                --input-bg: #0f172a;
            }
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 650px;
        }

        .header-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .back-btn {
            padding: 8px 16px;
            border-radius: 10px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            border-color: var(--primary);
            box-shadow: 0 0 10px var(--primary-glow);
        }

        .subject-header {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: 0 0 20px rgba(37, 99, 235, 0.15);
        }

        .subject-title {
            font-size: 1.4rem;
            font-weight: 800;
            margin: 0 0 8px 0;
        }

        .lectures-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .lecture-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
            transition: all 0.3s ease;
        }

        .lecture-card:hover {
            border-color: var(--primary);
            box-shadow: 0 0 15px var(--primary-glow);
        }

        .lecture-title {
            font-size: 1.05rem;
            font-weight: 700;
            margin: 0 0 10px 0;
        }

        .actions-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .action-btn {
            flex: 1;
            min-width: 120px;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: var(--input-bg);
            color: var(--text-color);
            text-decoration: none;
            text-align: center;
            font-size: 0.85rem;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .action-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
            box-shadow: 0 0 10px var(--primary-glow);
        }

        .footer-credits {
            text-align: center;
            margin-top: 30px;
            font-size: 0.8rem;
            color: var(--text-muted);
            border-top: 1px solid var(--border-color);
            padding-top: 16px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-nav">
            <a href="javascript:history.back()" class="back-btn">← العودة للخلف</a>
        </div>

        <div class="subject-header">
            <h1 class="subject-title">🎥 المحاضرات والمذكرات المتاحة</h1>
            <p style="color: var(--text-muted); margin: 0; font-size: 0.9rem;">يمكنك مشاهدة المحاضرات وتحميل الملفات الخاصة بالمادة من الرابط أدناه.</p>
        </div>

        <div class="lectures-list">
            <!-- محاضرة 1 -->
            <div class="lecture-card">
                <h3 class="lecture-title">المحاضرة الأولى: مقدمة في المقرر</h3>
                <div class="actions-group">
                    <a href="#" target="_blank" class="action-btn">▶ مشاهدة الفيديو</a>
                    <a href="#" target="_blank" class="action-btn">📄 تحميل المذكرة (PDF)</a>
                </div>
            </div>

            <!-- محاضرة 2 -->
            <div class="lecture-card">
                <h3 class="lecture-title">المحاضرة الثانية: الشرح التفصيلي</h3>
                <div class="actions-group">
                    <a href="#" target="_blank" class="action-btn">▶ مشاهدة الفيديو</a>
                    <a href="#" target="_blank" class="action-btn">📄 تحميل المذكرة (PDF)</a>
                </div>
            </div>
        </div>

        <div class="footer-credits">
            تطوير المهندس عبدالناصر © 2026
        </div>
    </div>

</body>
</html>
