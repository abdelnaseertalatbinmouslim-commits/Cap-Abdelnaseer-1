<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفاصيل المادة الدراسية | منصة الكابتن</title>
    <style>
        :root {
            --bg-color: #f0f4f8;
            --card-bg: rgba(255, 255, 255, 0.95);
            --text-color: #0f172a;
            --text-muted: #475569;
            --primary: #2563eb;
            --primary-glow: #3b82f6;
            --border-color: #cbd5e1;
            --input-bg: #ffffff;
            --accent-cyan: #06b6d4;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #0b0f19;
                --card-bg: rgba(18, 24, 38, 0.95);
                --text-color: #f8fafc;
                --text-muted: #94a3b8;
                --primary: #3b82f6;
                --primary-glow: #60a5fa;
                --border-color: #1e293b;
                --input-bg: #0f172a;
                --accent-cyan: #06b6d4;
            }
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            padding: 20px 10px;
            box-sizing: border-box;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 650px;
        }

        .header-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .back-btn {
            padding: 8px 16px;
            border-radius: 10px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            border-color: var(--primary);
            box-shadow: 0 0 10px var(--primary-glow);
        }

        .subject-header {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: 0 0 20px rgba(37, 99, 235, 0.15);
        }

        .subject-title {
            font-size: 1.4rem;
            font-weight: 800;
            margin: 0 0 8px 0;
            background: linear-gradient(135deg, var(--text-color) 0%, var(--accent-cyan) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .lectures-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .lecture-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
            transition: all 0.3s ease;
        }

        .lecture-card:hover {
            border-color: var(--primary);
            box-shadow: 0 0 15px var(--primary-glow);
        }

        .lecture-title {
            font-size: 1.05rem;
            font-weight: 700;
            margin: 0 0 6px 0;
        }

        .lecture-desc {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin: 0 0 12px 0;
        }

        .actions-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .action-btn {
            flex: 1;
            min-width: 120px;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: var(--input-bg);
            color: var(--text-color);
            text-decoration: none;
            text-align: center;
            font-size: 0.85rem;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .action-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
            box-shadow: 0 0 10px var(--primary-glow);
        }

        .footer-credits {
            text-align: center;
            margin-top: 30px;
            font-size: 0.8rem;
            color: var(--text-muted);
            border-top: 1px solid var(--border-color);
            padding-top: 16px;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-nav">
            <a href="javascript:history.back()" class="back-btn">← العودة للخلف</a>
            <span id="studentGradeBadge" style="font-size: 0.85rem; font-weight: bold; color: var(--accent-cyan);">جاري التحميل...</span>
        </div>

        <div class="subject-header">
            <h1 class="subject-title">🎥 المحاضرات والمقررات الدراسية</h1>
            <p style="color: var(--text-muted); margin: 0; font-size: 0.9rem;">يمكنك مشاهدة المحاضرات والمواد المتاحة لفئتك الدراسية مباشرة من الأزرار أدناه.</p>
        </div>

        <!-- قائمة المحاضرات الديناميكية -->
        <div class="lectures-list" id="dynamicLecturesContainer">
            <div class="lecture-card" style="text-align: center;">
                <p style="color: var(--text-muted); margin: 0;">جاري تحميل المحاضرات المتاحة...</p>
            </div>
        </div>

        <div class="footer-credits">
            تطوير المهندس عبدالناصر © 2026
        </div>
    </div>

    <script>
        const FIREBASE_URL = "https://abodaa-default-rtdb.firebaseio.com";

        document.addEventListener("DOMContentLoaded", () => {
            // عرض فئة الطالب المحفوظة في التخزين المحلي
            const studentGrade = localStorage.getItem('studentGrade') || 'الجميع';
            document.getElementById('studentGradeBadge').innerText = studentGrade;

            // جلب المحاضرات المرتبطة من قاعدة البيانات
            fetchCoursesData(studentGrade);
        });

        async function fetchCoursesData(studentGrade) {
            try {
                const res = await fetch(`${FIREBASE_URL}/courses.json`);
                const courses = await res.json() || {};
                const container = document.getElementById('dynamicLecturesContainer');
                
                container.innerHTML = '';
                const keys = Object.keys(courses);

                if (keys.length === 0) {
                    container.innerHTML = `
                        <div class="lecture-card" style="text-align: center;">
                            <h3 class="lecture-title" style="color: var(--text-muted);">لا توجد محاضرات مرفوعة حالياً</h3>
                            <p class="lecture-desc">تابع لوحة الإشعارات لحين رفع محتوى جديد.</p>
                        </div>
                    `;
                    return;
                }

                let foundCount = 0;

                // تصفية المحاضرات بناءً على فئة الطالب (أو المحتوى المخصص للجميع)
                keys.reverse().forEach(id => {
                    const c = courses[id];
                    if (c.grade === 'الجميع' || c.grade === studentGrade) {
                        foundCount++;
                        container.innerHTML += `
                            <div class="lecture-card">
                                <h3 class="lecture-title">${c.title}</h3>
                                <p class="lecture-desc">${c.desc || 'شرح تفصيلي للمقرر الدراسي والمحاضرة المطلوبة.'}</p>
                                <div class="actions-group">
                                    <a href="${c.link}" target="_blank" class="action-btn">▶ مشاهدة المحتوى</a>
                                </div>
                            </div>
                        `;
                    }
                });

                if (foundCount === 0) {
                    container.innerHTML = `
                        <div class="lecture-card" style="text-align: center;">
                            <h3 class="lecture-title" style="color: var(--text-muted);">لا توجد محاضرات مخصصة لفئتك الدراسية حالياً</h3>
                            <p class="lecture-desc">يرجى مراجعة الدعم الفني أو الانتظار حتى يتم رفع المحتوى.</p>
                        </div>
                    `;
                }

            } catch (err) {
                console.error("خطأ في جلب المحاضرات:", err);
                document.getElementById('dynamicLecturesContainer').innerHTML = `
                    <div class="lecture-card" style="text-align: center;">
                        <h3 class="lecture-title" style="color: #ef4444;">حدث خطأ أثناء تحميل البيانات</h3>
                        <p class="lecture-desc">تأكد من اتصالك بالإنترنت.</p>
                    </div>
                `;
            }
        }
    </script>
</body>
</html>
